appId: com.fedlearn.desktop
productName: FedLearn Desktop
copyright: Copyright © 2024 FedLearn Team

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - "!dist/**/*.map"
  - "!dist/**/*.d.ts"
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.map"

asar: true
compression: maximum

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  artifactName: "${productName}-${version}-${arch}.dmg"

linux:
  category: Development
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64

deb:
  artifactName: "${productName}-${version}-${arch}.deb"
  depends:
    - docker.io

rpm:
  artifactName: "${productName}-${version}-${arch}.rpm"
  depends:
    - docker

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-${version}-Setup.exe"
