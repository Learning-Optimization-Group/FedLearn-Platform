<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP content is baked in at build time by HtmlWebpackPlugin's templateParameters
         (see webpack.csp.js) — dev keeps 'unsafe-eval' for webpack's eval devtool,
         the packaged production build does not. -->
    <meta http-equiv="Content-Security-Policy" content="<%= htmlWebpackPlugin.options.templateParameters.csp %>" />
    <meta name="description" content="FedLearn Desktop — train AI together, privately. Run a federated learning client on your own device." />
    <title>FedLearn Desktop</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
