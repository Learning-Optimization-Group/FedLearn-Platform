# Supply-chain / secret scanning (audit Theme 4 + the "gitleaks + npm/pip audit" quick win).
# Runs on PRs, main pushes, and weekly. VERIFY-BEFORE-USE: action versions + audit thresholds.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for organization
      # accounts; use the free, license-unencumbered CLI instead. The allowlist of
      # known public test/dev fixtures lives in .gitleaks.toml.
      - name: gitleaks
        run: |
          GL=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1 --config .gitleaks.toml

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit (framework deps)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: framework/requirements.txt
          # transformers 4.55.2 advisories: the only fix is transformers 5.x, which
          # requires a coordinated tokenizers (>=0.22) + huggingface-hub (>=1.5) major
          # bump and is used by the FoT path — tracked as a separate upgrade. All other
          # framework deps are patched (flwr removed; aiohttp/pillow/requests/cryptography bumped).
          ignore-vulns: |
            PYSEC-2025-214
            PYSEC-2025-215
            PYSEC-2025-216
            PYSEC-2025-217
            PYSEC-2025-218
            CVE-2026-1839

  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, fedlearn-desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm audit (${{ matrix.project }})
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=high

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: fedlearn-sbom.cdx.json
