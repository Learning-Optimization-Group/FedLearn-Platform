# Supply-chain / secret scanning (audit Theme 4 + the "gitleaks + npm/pip audit" quick win).
# Runs on PRs, main pushes, and weekly. VERIFY-BEFORE-USE: action versions + audit thresholds.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for organization
      # accounts; use the free, license-unencumbered CLI instead. The allowlist of
      # known public test/dev fixtures lives in .gitleaks.toml.
      - name: gitleaks
        run: |
          GL=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1 --config .gitleaks.toml

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit (framework deps)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: framework/requirements.txt
          # Everything fixable IS fixed here (flwr removed; aiohttp/pillow/requests/cryptography/
          # click bumped). Each entry below is ignored because it cannot be, with the reason:
          #
          # PYSEC-2025-214..218, CVE-2026-1839 — earlier entries, kept as they were.
          #
          # PYSEC-2025-194 (torch 2.12.0 -> 2.13.0) and PYSEC-2026-3447 (setuptools 81.0.0 ->
          #   83.0.0): torch is pinned to the version the DeComFL golden fixtures were generated
          #   with (framework/tests/fixtures/decomfl_golden) and paired with executorch 1.3.1, and
          #   torch 2.12.0 itself requires setuptools<82 — so neither moves until those fixtures
          #   are regenerated against a newer torch/ExecuTorch pairing.
          #
          # PYSEC-2026-2289/2290/3929 (transformers 4.55.2): the fixes are transformers 5.3/5.5/
          #   5.10, a major bump that also needs tokenizers >=0.22 and huggingface-hub >=1.5, and
          #   the FoT path depends on it — tracked as a separate upgrade.
          #
          # PYSEC-2026-3716 (datasets 3.1.0 -> 5.0.1): major bump, coupled to the same
          #   huggingface-hub move as transformers.
          #
          # PYSEC-2026-3804 (accelerate 1.10.0): no fixed version is published (checked against
          #   OSV), so there is nothing to upgrade to; revisit when one ships.
          ignore-vulns: |
            PYSEC-2025-214
            PYSEC-2025-215
            PYSEC-2025-216
            PYSEC-2025-217
            PYSEC-2025-218
            CVE-2026-1839
            PYSEC-2025-194
            PYSEC-2026-2289
            PYSEC-2026-2290
            PYSEC-2026-3929
            PYSEC-2026-3716
            PYSEC-2026-3804
            PYSEC-2026-3447

  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, fedlearn-desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm audit (${{ matrix.project }})
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=high

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: fedlearn-sbom.cdx.json
