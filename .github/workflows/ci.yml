# PR-time CI — the load-bearing gate the audit flagged as missing (Theme 4: "every other defect
# compounds because nothing gates PRs"). Per-stack jobs run only when that stack changes
# (dorny/paths-filter), so PRs get fast, relevant feedback. Make these required checks in branch
# protection (see docs/v2/ci-and-branch-protection.md).
#
# VERIFY-BEFORE-USE: pinned tool versions + per-stack commands; confirm against each subproject.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      framework: ${{ steps.filter.outputs.framework }}
      backend: ${{ steps.filter.outputs.backend }}
      backend_scripts: ${{ steps.filter.outputs.backend_scripts }}
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
      client_docker: ${{ steps.filter.outputs.client_docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            framework:
              - 'framework/**'
            backend:
              - 'backend/**'
            backend_scripts:
              - 'backend/fl-platform-api/src/main/resources/scripts/**'
              - 'backend/fl-platform-api/requirements.txt'
            frontend:
              - 'frontend/**'
            desktop:
              - 'fedlearn-desktop/**'
            mobile:
              - 'mobile_client/**'
            client_docker:
              - 'client-docker/**'

  framework:
    needs: changes
    if: ${{ needs.changes.outputs.framework == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (CPU torch + framework deps + pytest)
        run: |
          python -m pip install --upgrade pip
          # CPU torch pinned to the golden-fixture version (framework/tests/fixtures/decomfl_golden);
          # the perturbation version-gate compares the base version (2.12.0).
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.12.0"
          pip install -r framework/requirements.txt pytest
          pip install -e framework
      - name: pytest
        working-directory: framework
        run: PYTHONPATH=src python -m pytest -q

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 'Gradle test (test profile: in-memory H2, Flyway disabled)'
        working-directory: backend/fl-platform-api
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./gradlew test --no-daemon

  # TE-4: the FL trainer scripts (recipes/client/init_model/fl_server/infer) ship a committed
  # pytest suite that ran in no CI job. Gate it here so a script regression fails a PR. Runs only
  # when the scripts (or their requirements) change — Java-only backend edits skip this job.
  backend-scripts:
    needs: changes
    if: ${{ needs.changes.outputs.backend_scripts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (CPU torch + FL-script deps + pytest)
        run: |
          python -m pip install --upgrade pip
          # CPU wheels to avoid the CUDA download; versions pinned to requirements.txt so pip
          # treats them as satisfied and does not re-resolve torch off the default index.
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1" "torchvision==0.20.1" "torchaudio==2.5.1"
          pip install -r backend/fl-platform-api/requirements.txt pytest
      - name: pytest (FL trainer scripts; pytest.ini deselects -m slow)
        working-directory: backend/fl-platform-api/src/main/resources/scripts
        run: python -m pytest -q

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install + lint + typecheck + build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build

  desktop:
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fedlearn-desktop/package-lock.json
      - name: Install + lint + test
        working-directory: fedlearn-desktop
        run: |
          npm ci
          npm run lint --if-present
          npm test

  # TE-3: the mobile RN TypeScript app had ZERO CI gate — tsc + jest never ran anywhere. Gate them
  # here (type-check + jest). NOT eslint: mobile has no flat config yet (TE-9). Fast JS-only job,
  # kept separate from the heavy native Android (.so) build.
  mobile-js:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile_client/package-lock.json
      - name: Install + typecheck + jest
        working-directory: mobile_client
        run: |
          npm ci
          npx tsc --noEmit
          npx jest --ci

  # TE-6: client-docker is a full deployable unit (containerized FL client, a thin wrapper around
  # framework/) that shipped with ZERO CI — a broken Dockerfile or requirements.txt went unnoticed
  # until a user pulled the image. Build the image on PRs that touch it, then smoke-test that the
  # entrypoint launches the client. Runs only when client-docker/ changes.
  #
  # amd64 ONLY. The Dockerfile's default BASE_IMAGE is x86 PyTorch/CUDA; GitHub-hosted runners are
  # amd64 and have no GPU, but CUDA runtime libs load lazily so a CPU-only build + `--help` is fine.
  # The Jetson lane (--build-arg BASE_IMAGE=nvcr.io/nvidia/l4t-pytorch:r35.2.1-pth2.0-py3) is arm64
  # and needs real CUDA hardware — it belongs on a separate self-hosted arm64 runner, NOT here.
  client-docker:
    needs: changes
    if: ${{ needs.changes.outputs.client_docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build context is the repo root: the Dockerfile COPYs both framework/ and client-docker/.
      # gha layer cache keeps unchanged base/dep layers warm across runs.
      - name: Build image (amd64 default BASE_IMAGE)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client-docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: fedlearn-client:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Smoke: run through the real entrypoint. It requires the three env vars, then execs
      # `client.py <flags> --help`; argparse prints help and exits 0 before any gRPC connect,
      # so this proves the framework + client imports load and the entrypoint wiring is sound.
      - name: Smoke-test entrypoint (client.py --help)
        run: |
          docker run --rm \
            -e PROJECT_ID=smoke \
            -e SERVER_ADDRESS=localhost:50000 \
            -e PARTITION_ID=0 \
            fedlearn-client:ci --help
