# Mobile FL client CI (15-LLD-mobile.md §13 task 19). The golden-vector parity test GATES the
# build (the M10 checkpoint, 90-BUILD-SEQUENCE §M10): a build whose perturbations diverge from the
# Python fixture must never ship.
#
# Native runtime: the C++ FL core links the ExecuTorch runtime (no libtorch/ATen). The host
# parity gate builds ET from source and links its static libs; the Android job cross-compiles ET
# for arm64 and links it STATICALLY into libfedlearn_jni.so (no executorch-android AAR — the
# runtime is embedded; the app calls the C++ core via JNI, never ET's Java API).
#
# Gating jobs (run on every PR, fast): proto-mirror, python-parity, cpp-parity.
# Heavy job (android .so size budget): gated by the repo variable MOBILE_NATIVE_CI=='true', since it
# needs the Android app project (task 16) + the cached cross-compiled ExecuTorch/gRPC arm64 artifacts.
#
# VERIFY-BEFORE-USE: pinned torch/ExecuTorch versions + action versions + the ET arm64 build flags;
# confirm before first run.
name: mobile

on:
  push:
    branches: [main]
    paths:
      - 'mobile_client/**'
      - 'proto/**'
      - 'framework/tests/fixtures/decomfl_golden/**'
      - 'framework/src/fedlearn/estimators/perturbation.py'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile_client/**'
      - 'proto/**'
      - 'framework/tests/fixtures/decomfl_golden/**'
      - 'framework/src/fedlearn/estimators/perturbation.py'
      - '.github/workflows/mobile.yml'
  # TE-8: nightly native .so build. The arm64 ExecuTorch/gRPC APK build is far too heavy to gate every
  # PR on, but must not bit-rot silently — run it once a night for regression signal + an APK artifact.
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_VERSION: '2.12.0' # MUST match framework/tests/fixtures/decomfl_golden/manifest.json; supplies the
                          # torch/headeronly cmake_macros.h header (TORCH_INCLUDE), NOT a link target.
  ET_VERSION: '1.3.1'     # ExecuTorch runtime version (host parity build + arm64 cross-compile pin)
  SO_BUDGET_MB: '60' # libfedlearn_jni.so arm64 budget (placeholder; calibrate after first measure, A6 M-H1).
                     # ET static is far smaller than libtorch — recalibrate once the first run reports a size.

jobs:
  # ---- the mobile proto mirror must not diverge from the canonical proto (E6) ----
  proto-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check proto mirror == canonical
        run: bash scripts/check_proto_mirror.sh

  # ---- Python source-of-truth: canonical_perturbation reproduces the frozen golden fixture ----
  python-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU torch + test deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"
          pip install numpy pytest
      - name: Run perturbation parity tests
        working-directory: framework
        run: PYTHONPATH=src pytest tests/test_perturbation.py -v

  # ---- C++ parity gate: the gtests compare the C++ core to the Python golden fixture ----
  # The core links the ExecuTorch runtime (no libtorch/ATen). The ET pip package ships headers but
  # NO host libs, so ET MUST be built from source here (cached). torch is pip-installed only to
  # supply the missing torch/headeronly/macros/cmake_macros.h header (TORCH_INCLUDE), not for linking.
  # This mirrors the host build verified green (32 tests).
  cpp-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build unzip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU torch (for the cmake_macros.h header only)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"
          echo "TORCH_INCLUDE=$(python -c 'import torch, os; print(os.path.join(os.path.dirname(torch.__file__), "include"))')" >> "$GITHUB_ENV"
      - name: Restore host ExecuTorch build
        id: et-cache
        uses: actions/cache@v4
        with:
          path: "${{ runner.temp }}/executorch"
          key: et-host-v${{ env.ET_VERSION }}-${{ runner.os }}
      - name: Build host ExecuTorch from source if cache missed
        if: steps.et-cache.outputs.cache-hit != 'true'
        run: |
          ET_SRC="$RUNNER_TEMP/executorch"
          git clone --depth 1 --branch "v${ET_VERSION}" https://github.com/pytorch/executorch "$ET_SRC"
          cd "$ET_SRC"
          git submodule sync
          git submodule update --init --recursive --depth 1
          cmake -S . -B cmake-out -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXECUTORCH_BUILD_EXTENSION_MODULE=ON \
            -DEXECUTORCH_BUILD_EXTENSION_NAMED_DATA_MAP=ON \
            -DEXECUTORCH_BUILD_EXTENSION_TENSOR=ON \
            -DEXECUTORCH_BUILD_EXTENSION_DATA_LOADER=ON \
            -DEXECUTORCH_BUILD_KERNELS_OPTIMIZED=ON
          cmake --build cmake-out -j"$(nproc)"
      - name: Configure + build the C++ core tests
        run: |
          cmake -S mobile_client -B build/shared -G Ninja \
            -DFEDLEARN_BUILD_TESTS=ON \
            -DET_SRC="$RUNNER_TEMP/executorch" \
            -DET_BUILD="$RUNNER_TEMP/executorch/cmake-out" \
            -DTORCH_INCLUDE="$TORCH_INCLUDE" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/shared --target fedlearn_core_tests
      - name: Run parity + roundtrip gtests (golden-vector test gates the build)
        run: ctest --test-dir build/shared --output-on-failure

  # ---- Android arm64 .so build + size budget. Gated until the Android app project (task 16) and
  #      the cross-compiled ExecuTorch/gRPC arm64 cache exist. Enable with repo var MOBILE_NATIVE_CI.
  #      ExecuTorch is the lean runtime — the arm64 cross-compile is minutes (not the hours libtorch
  #      took), which makes this APK build tractable on a hosted runner. ----
  android-so-size:
    # TE-8: gated OFF for normal push/PR (the arm64 native build is heavy), but runs on the nightly
    # schedule for regression signal — and can still be force-enabled anytime via MOBILE_NATIVE_CI.
    if: ${{ github.event_name == 'schedule' || vars.MOBILE_NATIVE_CI == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
      - uses: bufbuild/buf-setup-action@v1
      - name: Generate C++ gRPC stubs
        working-directory: proto
        run: buf generate
      # TORCH_INCLUDE for the APK build must be a HEADERONLY-scoped shim, NOT the full torch/include:
      # per shared/CMakeLists.txt the full dir also carries torch's stale bundled google/protobuf/*,
      # which — on the include path of the gRPC-linked app target — shadows the gRPC protobuf and fails
      # the FedLearnCoreModule.cpp compile with "unknown type name 'uint8'". Copy just torch/headeronly
      # (which supplies the cmake_macros.h the ET headers need) into an otherwise-empty dir so protobuf
      # can't leak. (The host cpp-parity gate above is gRPC-free, so it can use the full dir safely.)
      - name: Install CPU torch + build a headeronly TORCH_INCLUDE shim (cmake_macros.h only)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"
          FULL_INC="$(python -c 'import torch, os; print(os.path.join(os.path.dirname(torch.__file__), "include"))')"
          SHIM="${RUNNER_TEMP}/torch-headeronly-shim"
          rm -rf "$SHIM" && mkdir -p "$SHIM/torch"
          cp -r "$FULL_INC/torch/headeronly" "$SHIM/torch/headeronly"
          test -f "$SHIM/torch/headeronly/macros/cmake_macros.h"  # fail loudly if the layout ever changes
          test ! -e "$SHIM/google"                                # the polluter must NOT be in the shim
          echo "TORCH_INCLUDE=${SHIM}" >> "$GITHUB_ENV"
      - name: Restore cross-compiled arm64 ExecuTorch + gRPC
        uses: actions/cache@v4
        with:
          path: mobile_client/.artifacts
          key: native-arm64-et${{ env.ET_VERSION }}-grpcv1.67.1-ndk-r27
      - name: Build arm64 native deps if cache missed
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
          ET_VERSION: ${{ env.ET_VERSION }}
          GRPC_CPP_VERSION: v1.67.1
        run: |
          [ -d mobile_client/.artifacts/executorch-android-v${ET_VERSION}-arm64-v8a/executorch/cmake-out ] || \
            ( cd mobile_client && bash scripts/build_executorch_arm64.sh )
          [ -d mobile_client/.artifacts/grpc-android-${GRPC_CPP_VERSION}-arm64-v8a ] || \
            ( cd mobile_client && bash scripts/build_grpc_arm64.sh )
      - name: Build the Android release APK and check the .so budget
        working-directory: mobile_client/android
        env:
          ET_VERSION: ${{ env.ET_VERSION }}
          GRPC_CPP_VERSION: v1.67.1
        run: |
          ./gradlew assembleRelease \
            -PET_SRC="${GITHUB_WORKSPACE}/mobile_client/.artifacts/executorch-android-v${ET_VERSION}-arm64-v8a/executorch" \
            -PET_BUILD="${GITHUB_WORKSPACE}/mobile_client/.artifacts/executorch-android-v${ET_VERSION}-arm64-v8a/executorch/cmake-out" \
            -PTORCH_INCLUDE="${TORCH_INCLUDE}" \
            -PGRPC_DIR="${GITHUB_WORKSPACE}/mobile_client/.artifacts/grpc-android-${GRPC_CPP_VERSION}-arm64-v8a" \
            -PGENERATED_PROTO_DIR="${GITHUB_WORKSPACE}/proto/gen/cpp"
          SO=$(unzip -l app/build/outputs/apk/release/app-release.apk | awk '/libfedlearn_jni\.so/ {print $1}')
          MB=$(( SO / 1024 / 1024 ))
          echo "libfedlearn_jni.so = ${MB} MB (budget ${SO_BUDGET_MB} MB)"
          test "${MB}" -le "${SO_BUDGET_MB}"
      # TE-8: keep the nightly APK so the native build is retrievable (and its .so inspectable) without
      # a local NDK toolchain. Only on the scheduled run — on-demand MOBILE_NATIVE_CI runs skip it.
      - name: Upload the nightly release APK
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile_client/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
