# =============================================================================
# FedLearn Desktop — Build & Release Workflow
# =============================================================================
# Triggers on version tags (e.g. v1.0.0, v1.2.3-beta.1).
#
# Each matrix row:
#   1. Sets up Node.js 22 + Python 3.11
#   2. Builds the PyInstaller native client (torch + fedlearn) into
#      client-docker/packaging/dist/fedlearn-client/
#   3. Builds the Electron webpack bundles
#   4. Packages the Electron installer (electron-builder picks up the native
#      bundle via extraResources in electron-builder.yml)
#
# PyInstaller does not cross-compile — each OS/arch target needs a native
# runner. Mac arm64 → macos-latest, Mac x64 → macos-13, Win x64 → windows-
# latest, Linux x64 → ubuntu-latest, Linux arm64 → ubuntu-24.04-arm.
#
# Windows ships two variants (CPU and CUDA 12.4) from the same runner image.
# =============================================================================

name: Build & Release Electron Desktop

on:
  push:
    tags:
      # Per-unit release prefix: only desktop tags build the desktop app.
      # (Frontend/mobile use their own prefixes so they don't trigger this.)
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. desktop-v3.1.0-beta)'
        required: false
        default: ''

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-latest
            platform: mac
            arch: arm64
            native-cmd: ./build-mac.sh
            eb-cmd: npx electron-builder --mac --arm64 --publish never

          # mac-x64 (Intel) dropped: macos-13 runner queue is unreliable as
          # GitHub phases it out, and arm64 PyInstaller can't cross-compile
          # to x64 so no alternative runner works. Intel Mac users can run
          # the arm64 build under Rosetta if absolutely needed.

          - name: win-x64-cpu
            os: windows-latest
            platform: win
            arch: x64
            variant: cpu
            native-cmd: .\build-win-cpu.ps1
            # Single-quoted to keep ${version} literal for electron-builder's
            # own template expansion (bash would otherwise expand it to empty).
            eb-cmd: "npx electron-builder --win --x64 --publish never -c.nsis.artifactName='FedLearn-Desktop-Setup-${version}-cpu.exe'"

          - name: win-x64-cuda
            os: windows-latest
            platform: win
            arch: x64
            variant: cuda
            native-cmd: .\build-win-cuda.ps1
            eb-cmd: "npx electron-builder --win --x64 --publish never -c.nsis.artifactName='FedLearn-Desktop-Setup-${version}-cuda.exe'"

          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            native-cmd: ./build-linux.sh
            # target:arch pairs REPLACE the config's target list — this keeps
            # @electron/rebuild from also running for arm64 on an x64 host
            # (which would try to cross-compile native deps like cpu-features).
            eb-cmd: npx electron-builder --linux AppImage:x64 deb:x64 --publish never

          - name: linux-arm64
            os: ubuntu-24.04-arm    # native arm64 runner; avoids qemu emulation for PyInstaller + torch aarch64 wheel
            platform: linux
            arch: arm64
            native-cmd: ./build-linux.sh
            # See linux-x64 note above — target:arch pairs are required here
            # because aarch64 gcc has no -m64 flag, so the stray x64 rebuild
            # step fails with "unrecognized command-line option '-m64'".
            eb-cmd: npx electron-builder --linux AppImage:arm64 deb:arm64 --publish never

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    # Cap per-job wall clock so a queued / hung runner can't stall the
    # release job (default is 6h on public runners).
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: fedlearn-desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ── Native client (PyInstaller bundle shipped inside the installer) ──
      - name: Build native client (${{ matrix.name }})
        working-directory: client-docker/packaging
        run: ${{ matrix.native-cmd }}

      - name: Verify native bundle was produced
        shell: bash
        run: |
          if [ ! -d "client-docker/packaging/dist/fedlearn-client" ]; then
            echo "::error::PyInstaller bundle missing at client-docker/packaging/dist/fedlearn-client"
            exit 1
          fi
          ls -la client-docker/packaging/dist/fedlearn-client | head -5

      # ── Electron installer ──
      - name: Install npm dependencies
        working-directory: fedlearn-desktop
        run: npm ci

      - name: Build webpack bundles (production)
        working-directory: fedlearn-desktop
        run: npm run build

      - name: Package Electron app
        working-directory: fedlearn-desktop
        shell: bash
        env:
          # No Apple Developer ID / Authenticode certs wired yet. Users will
          # see Gatekeeper / SmartScreen warnings on first launch. Remove these
          # and populate MAC_CERTS / WIN_CERTS secrets to enable signing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.eb-cmd }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            fedlearn-desktop/release/*.dmg
            fedlearn-desktop/release/*.exe
            fedlearn-desktop/release/*.deb
            fedlearn-desktop/release/*.rpm
            fedlearn-desktop/release/*.AppImage
            fedlearn-desktop/release/*.zip
            fedlearn-desktop/release/*.blockmap
            fedlearn-desktop/release/latest*.yml
          if-no-files-found: warn
          retention-days: 5

  # ─── Create GitHub Release ─────────────────────────────────────────────────
  release:
    needs: build
    # Publish whatever artifacts succeeded — don't let one flaky runner (e.g.
    # the retiring macos-13 queue) block the whole release. Still skip on
    # manual cancel so partial artifacts aren't silently shipped.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    name: Publish GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -40

      - name: Determine version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          # The pushed tag (e.g. desktop-v3.1.0-beta) is the release tag; the
          # display version strips the per-unit prefix (-> v3.1.0-beta).
          if [ -n "$DISPATCH_VERSION" ]; then
            TAG="$DISPATCH_VERSION"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Strip the desktop-v prefix to the bare semver electron-builder uses
          # in its artifact filenames (e.g. 3.1.0-beta).
          echo "version=${TAG#desktop-v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FedLearn Desktop ${{ steps.version.outputs.version }}
          body: |
            ## FedLearn Desktop ${{ steps.version.outputs.version }}

            Each installer bundles a standalone PyInstaller-built Python
            training client — **no Docker, no Python, no repo checkout**
            required on end-user machines (Mac, Windows, Linux x86_64/arm64).

            Jetson deployments still use the Docker path
            (`nvcr.io/nvidia/l4t-pytorch`) because NVIDIA's L4T torch wheel
            is pinned to a specific JetPack firmware stack.

            ### Downloads

            | Platform | Architecture | File |
            |----------|-------------|------|
            | macOS    | Apple Silicon (M1/M2/M3/M4) | `.dmg` (arm64) — MPS-accelerated |
            | Windows  | x64 (NVIDIA GPU) | `-Setup-${{ steps.version.outputs.version }}-cuda.exe` |
            | Windows  | x64 (no GPU) | `-Setup-${{ steps.version.outputs.version }}-cpu.exe` |
            | Linux    | x86_64 | `.deb` / `.AppImage` — CPU-only native |
            | Linux    | arm64  | `.deb` / `.AppImage` — CPU-only native |

            Intel Mac is not a shipped target; the arm64 build runs under
            Rosetta 2 if absolutely needed.

            ### Installation

            **macOS (Apple Silicon):**
            1. Download the arm64 `.dmg`
            2. Open and drag **FedLearn Desktop.app** to `/Applications`
            3. Run `xattr -cr "/Applications/FedLearn Desktop.app"` in Terminal
               (the build is unsigned; this clears the quarantine flag)
            4. Right-click the app → **Open** (first time only)

            **Windows:** Run the `-Setup.exe` installer. Pick the `-cuda`
            variant if you have an NVIDIA GPU with driver ≥ 550, otherwise
            `-cpu`. SmartScreen may warn about the unsigned installer —
            click **More info → Run anyway**.

            **Linux:** Install the `.deb` (`sudo dpkg -i ...`) or run the
            `.AppImage` directly (`chmod +x`, then execute).

            ### Requirements

            - **Mac / Windows / Linux native path**: no external dependencies
            - **Jetson path**: Docker + NVIDIA Container Toolkit (ships with JetPack)
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, 'beta') || contains(steps.version.outputs.tag, 'alpha') || contains(steps.version.outputs.tag, 'rc') }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
