name: Desktop App Release

on:
  push:
    tags:
      - 'v*' # Trigger automatically when you push a tag like v1.0.0

# Grant permission to create a GitHub Release and upload assets
permissions:
  contents: write

jobs:
  # ============================================================================
  # ACTIVE BUILDS (Mac M-Chip & Windows x64)
  # ============================================================================

  build-mac-arm64:
    name: Build Mac (M-Chip / ARM64)
    runs-on: macos-14 # GitHub's Apple Silicon (M1) runner
    defaults:
      run:
        working-directory: ./fedlearn-desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build and Package
        # Using explicit --arm64 flag to avoid building x64 binaries unnecessarily
        run: |
          npm run build
          npx electron-builder --mac dmg --arm64

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: fedlearn-desktop/release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win-x64:
    name: Build Windows (EXE / x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./fedlearn-desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build and Package
        run: |
          npm run build
          npx electron-builder --win nsis --x64

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: fedlearn-desktop/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

