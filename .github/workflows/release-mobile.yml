# =============================================================================
# FedLearn Mobile — Android (native) Build & Release
# =============================================================================
# Triggers on per-unit mobile tags (e.g. mobile-v2.1.0) so it never fires on
# desktop (desktop-v*) or other tags.
#
# This is a FULL-NATIVE attempt: it cross-compiles ARM64 libtorch + the gRPC
# C++ runtime from source (mobile_client/scripts/build_*_arm64.sh), generates
# the C++ proto stubs (buf), and assembles a release APK whose
# libfedlearn_jni.so embeds the native FL core (the same recipe as the
# `android-so-size` job in mobile.yml).
#
# HEAVY / FRAGILE: building libtorch for Android from source on a hosted runner
# is enormous (clones pytorch + submodules and compiles full JIT). It can take
# hours and may exhaust the runner — expect this to need a self-hosted/large
# runner or a pre-populated `mobile_client/.artifacts` cache to go green.
#
# iOS is intentionally absent: it needs full Xcode + manually cross-compiled
# libtorch/gRPC xcframeworks + signing, none of which are CI-reproducible
# (see mobile_client/ios/generate_xcodeproj.sh and the mobile README).
# =============================================================================

name: Build & Release Android (native)

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. mobile-v2.1.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  TORCH_VERSION: '2.12.0'      # MUST match framework golden manifest + mobile.yml
  GRPC_CPP_VERSION: 'v1.67.1'  # MUST match build_grpc_arm64.sh default + buf C++ plugin

jobs:
  build-android:
    runs-on: ubuntu-latest
    # Cross-compiling libtorch from source dwarfs the default; cap near the
    # hosted-runner ceiling so a hung build can't run indefinitely.
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python (PyTorch Android build needs it)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1

      - name: Install native build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip
          python -m pip install --upgrade pip
          pip install pyyaml typing_extensions

      - name: Generate C++ gRPC stubs
        working-directory: proto
        run: buf generate          # -> proto/gen/cpp

      - name: Install RN dependencies
        working-directory: mobile_client
        # RN 0.80 needs --legacy-peer-deps (a react-navigation peer range);
        # assembleRelease autolinks + bundles the JS from node_modules.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Restore cross-compiled ARM64 libtorch + gRPC
        uses: actions/cache@v4
        with:
          path: mobile_client/.artifacts
          key: native-arm64-torch${{ env.TORCH_VERSION }}-grpc${{ env.GRPC_CPP_VERSION }}-ndk-r27

      - name: Build ARM64 native deps if cache missed
        working-directory: mobile_client
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
          PYTORCH_TAG: v${{ env.TORCH_VERSION }}
          GRPC_CPP_VERSION: ${{ env.GRPC_CPP_VERSION }}
        run: |
          [ -d ".artifacts/libtorch-android-v${TORCH_VERSION}-arm64-v8a" ] || \
            bash scripts/build_libtorch_arm64.sh
          [ -d ".artifacts/grpc-android-${GRPC_CPP_VERSION}-arm64-v8a" ] || \
            bash scripts/build_grpc_arm64.sh

      - name: Assemble release APK (native FL core)
        working-directory: mobile_client/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PLIBTORCH_DIR="${GITHUB_WORKSPACE}/mobile_client/.artifacts/libtorch-android-v${TORCH_VERSION}-arm64-v8a" \
            -PGRPC_DIR="${GITHUB_WORKSPACE}/mobile_client/.artifacts/grpc-android-${GRPC_CPP_VERSION}-arm64-v8a" \
            -PGENERATED_PROTO_DIR="${GITHUB_WORKSPACE}/proto/gen/cpp"

      - name: Determine version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            TAG="$DISPATCH_VERSION"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#mobile-v}" >> "$GITHUB_OUTPUT"

      - name: Stage APK with version name
        id: apk
        working-directory: mobile_client/android
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          OUT="${GITHUB_WORKSPACE}/FedLearn-${VERSION}-arm64-v8a.apk"
          cp "$SRC" "$OUT"
          echo "path=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedlearn-android-${{ steps.version.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FedLearn Android ${{ steps.version.outputs.version }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## FedLearn Android ${{ steps.version.outputs.version }}

            arm64-v8a APK with the native C++ FL core (`libfedlearn_jni.so`,
            DeComFL zeroth-order path) embedded. New Architecture / TurboModule.

            > Debug-signed (no release keystore wired yet) — sideload only.
            > iOS is not shipped via CI; see the mobile README for the
            > on-device Xcode build.
