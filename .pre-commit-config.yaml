repos:
  # =================================================================
  # Python (framework/)
  # =================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix, --config, framework/pyproject.toml]
        files: ^framework/
      - id: ruff-format
        args: [--config, framework/pyproject.toml]
        files: ^framework/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: [
          types-PyYAML,
          types-protobuf,
          types-requests,
          types-tqdm,
        ]
        files: ^framework/
        args: [--config-file, framework/pyproject.toml]

  # =================================================================
  # JavaScript / TypeScript (frontend/, fedlearn-desktop/)
  # =================================================================
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.17.0
    hooks:
      - id: eslint
        args: [--config, frontend/eslint.config.js]
        files: ^frontend/
        additional_dependencies:
          - eslint
          - '@eslint/js'
          - eslint-plugin-react-hooks
          - eslint-plugin-react-refresh
          - globals
          - '@typescript-eslint/parser'
          - '@typescript-eslint/eslint-plugin'
          - typescript

      - id: eslint
        alias: eslint-desktop
        args: [--config, fedlearn-desktop/eslint.config.mjs]
        files: ^fedlearn-desktop/
        additional_dependencies:
          - eslint
          - '@eslint/js'
          - eslint-plugin-react-hooks
          - globals
          - '@typescript-eslint/parser'
          - '@typescript-eslint/eslint-plugin'
          - typescript

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^(frontend|fedlearn-desktop)/
        additional_dependencies:
          - prettier
          - '@trivago/prettier-plugin-sort-imports'

  # =================================================================
  # General
  # =================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: detect-private-key

  # =================================================================
  # Security
  # =================================================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [--recursive, --skip, B101,B104, framework/]
        files: ^framework/
