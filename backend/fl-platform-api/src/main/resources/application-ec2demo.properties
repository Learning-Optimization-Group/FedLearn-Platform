# EC2 demo profile — real secrets from env, no ECS.
# Activate: SPRING_PROFILES_ACTIVE=ec2demo

# ── Database: PostgreSQL (inherited from base) ──
# Defaults to localhost:5432/federance; on the EC2 host either run a local
# Postgres container or point at RDS via SPRING_DATASOURCE_URL/USERNAME/PASSWORD.

# ── Secrets: required from env, no fallbacks ──
app.jwt.secret=${APP_JWT_SECRET}
app.internal.api-key=${APP_INTERNAL_API_KEY}

# ── CORS: explicit EC2 IP + local dev origins ──
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ── Reverse proxy (OP-4): nginx terminates TLS and forwards to 127.0.0.1:8081, setting
#    X-Forwarded-For / X-Forwarded-Proto. Honour them via Tomcat's RemoteIpValve so getRemoteAddr()
#    is the real client IP — not the loopback proxy — for the SE-4 per-IP login throttle and the
#    audit trail, and so request.isSecure() reflects the TLS edge. RemoteIpValve trusts only
#    internal/loopback proxies by default, so a direct hit to :8081 cannot spoof these headers.
server.forward-headers-strategy=native

# ── Cookie: Secure is driven by APP_AUTH_COOKIE_SECURE (env > this file). ec2-bootstrap.sh sets it
#    to true once a Let's Encrypt cert exists (HTTPS live); it stays false for a plain-HTTP bring-up
#    so the login cookie isn't silently dropped before the cert is issued. Default false here. ──
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=Lax

# ── Feature flags ──
feature.log-persistence.enabled=${FEATURE_LOG_PERSISTENCE:false}
feature.round-result-reporting.enabled=${FEATURE_ROUND_RESULTS:true}

# ── FL gRPC TLS (SE-2): fail-closed by DEFAULT on this deployment profile ──
# The spawned FL server must serve TLS and REFUSE to bind plaintext: configureChildEnv turns this
# into FEDLEARN_REQUIRE_TLS=1, and the framework then fail-closes (server.py check). Certs come from
# FEDLEARN_GRPC_SERVER_{KEY,CERT}; ec2-bootstrap.sh provisions a keypair at /etc/fedlearn/grpc/ (OP-4).
# ⚠ This REJECTS any already-deployed PLAINTEXT desktop/mobile client until it is rebuilt with TLS —
# a deliberate security-posture choice. Escape hatch for a mixed-version rollout: set the env var
# APP_FL_REQUIRE_TLS=false (OS env outranks this file via Spring relaxed binding) to re-open plaintext.
app.fl.require-tls=true

# ── Logging: INFO (not DEBUG spam, not WARN silence) ──
logging.level.com.federated.fl_platform_api=INFO

# ── Graceful shutdown (useful even on single EC2) ──
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# ── Email / SMTP ──
app.email.provider=smtp
app.email.from=${APP_EMAIL_FROM:noreply@fedlearn.io}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Email test smoke endpoint (POST /api/admin/test-email) ──
# Disabled by default; flip APP_EMAIL_TEST_ENDPOINT_ENABLED=true on the host to enable.
app.email.test-endpoint.enabled=${APP_EMAIL_TEST_ENDPOINT_ENABLED:false}
