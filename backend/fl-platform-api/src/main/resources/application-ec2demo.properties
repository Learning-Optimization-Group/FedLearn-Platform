# EC2 demo profile — real secrets from env, no ECS.
# Activate: SPRING_PROFILES_ACTIVE=ec2demo

# ── Database: PostgreSQL (inherited from base) ──
# Defaults to localhost:5432/federance; on the EC2 host either run a local
# Postgres container or point at RDS via SPRING_DATASOURCE_URL/USERNAME/PASSWORD.

# ── Secrets: required from env, no fallbacks ──
app.jwt.secret=${APP_JWT_SECRET}
app.internal.api-key=${APP_INTERNAL_API_KEY}

# ── CORS: explicit EC2 IP + local dev origins ──
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ── Cookie: secure=false because EC2 demo runs plain HTTP ──
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax

# ── Feature flags ──
feature.log-persistence.enabled=${FEATURE_LOG_PERSISTENCE:false}
feature.round-result-reporting.enabled=${FEATURE_ROUND_RESULTS:true}

# ── Logging: INFO (not DEBUG spam, not WARN silence) ──
logging.level.com.federated.fl_platform_api=INFO

# ── Graceful shutdown (useful even on single EC2) ──
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# ── Email / SMTP ──
app.email.provider=smtp
app.email.from=${APP_EMAIL_FROM:noreply@fedlearn.io}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Email test smoke endpoint (POST /api/admin/test-email) ──
# Disabled by default; flip APP_EMAIL_TEST_ENDPOINT_ENABLED=true on the host to enable.
app.email.test-endpoint.enabled=${APP_EMAIL_TEST_ENDPOINT_ENABLED:false}
