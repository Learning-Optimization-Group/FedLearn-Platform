# ============================================================================
# TEST PROFILE — automated test runs (./gradlew test, CI)
#
# Activated by:
#   @ActiveProfiles("test") on individual @SpringBootTest classes (preferred)
#   SPRING_PROFILES_ACTIVE=test ./gradlew test  (whole-suite override)
#
# Goals: zero external dependencies, deterministic startup, no risk of
# accidentally pointing tests at the dev or prod database.
# ============================================================================

# ───────────────────────────────────────────────────────────────────────────
# In-memory H2 — wiped between test runs. Note the random DB name to ensure
# parallel @DirtiesContext tests don't cross-contaminate.
# ───────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:fedlearn-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ───────────────────────────────────────────────────────────────────────────
# Schema — let Hibernate create the schema for tests rather than running
# Flyway. Faster boot, and tests don't need the migration history audit
# trail. Flyway migrations are still validated by the dev/prod profiles.
# ───────────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# ───────────────────────────────────────────────────────────────────────────
# Public test-only secrets. Never used outside tests; safe to commit.
# ───────────────────────────────────────────────────────────────────────────
app.jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtZG8tbm90LXVzZS1pbi1wcm9kLg==
app.internal.api-key=test-only-internal-key

# ───────────────────────────────────────────────────────────────────────────
# CORS — permissive; tests don't go through a browser.
# ───────────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:*

# ───────────────────────────────────────────────────────────────────────────
# Cookie defaults — secure=false (no TLS in MockMvc), Lax SameSite.
# ───────────────────────────────────────────────────────────────────────────
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax

# ───────────────────────────────────────────────────────────────────────────
# Logging — quieter than dev so test output stays readable.
# ───────────────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.federated.fl_platform_api=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
