spring.application.name=fl-platform-api
server.port=8081
server.address=0.0.0.0

# ===============================
# Graceful shutdown — required for ECS task draining.
# When ECS sends SIGTERM (e.g. during a service update or scale-in), Tomcat
# stops accepting new connections immediately, then the JVM waits up to
# `timeout-per-shutdown-phase` for in-flight requests to finish before the
# container is killed. Without this, mid-flight requests are dropped and
# clients see TCP RSTs / 502s during deploys.
# ===============================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ===============================
# DATASOURCE (required in production; no fallbacks)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE — production: Flyway owns schema, Hibernate only validates.
# Never run ddl-auto=update against RDS.
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Flyway (production)
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ===============================
# Logging — production
# ===============================
# Quieter than dev: app code at INFO, frameworks at WARN.
# Operators can flip a package to DEBUG at runtime via /actuator/loggers
# without a redeploy.
logging.level.root=INFO
logging.level.com.federated.fl_platform_api=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.cors=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO

# Re-declare here so the prod profile keeps the loggers endpoint exposed.
management.endpoints.web.exposure.include=health,loggers

# ===============================
# JWT Configuration (required)
# ===============================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

# ===============================
# Auth cookie (SE-21): HTTPS-only + strict cross-site on this deployed profile
# ===============================
# Overrides the base Secure=false / SameSite=Lax defaults (those exist so local dev and the
# plain-HTTP ec2demo keep working). Production terminates TLS, so the login cookie must be Secure
# (HTTPS-only) and SameSite=Strict. The OS env vars still outrank this file if a specific deploy
# must relax it (Spring relaxed binding).
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:true}
app.auth.cookie.same-site=${APP_AUTH_COOKIE_SAME_SITE:Strict}

# ===============================
# CORS (required; comma-separated explicit origins)
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===============================
# Internal API key (required; no fallback)
# ===============================
app.internal.api-key=${APP_INTERNAL_API_KEY}

# Internal callback URL for Fargate FL-server tasks (required; no fallback).
# Use a VPC-internal ALB or Cloud Map DNS — not the public domain.
app.backend.internal-url=${APP_BACKEND_INTERNAL_URL}

# ===============================
# FL gRPC TLS (SE-2): fail-closed by DEFAULT on this deployment profile.
# ===============================
# The spawned FL server must serve TLS and REFUSE to bind plaintext: configureChildEnv turns this
# into FEDLEARN_REQUIRE_TLS=1 and the framework fail-closes. Provision certs via
# FEDLEARN_GRPC_SERVER_{KEY,CERT}. Escape hatch for a staged rollout: the OS env var
# APP_FL_REQUIRE_TLS=false outranks this file (Spring relaxed binding) to re-open plaintext.
app.fl.require-tls=true

# ===============================
# Actuator
# ===============================
# management.endpoints.web.exposure.include is set in the Logging section above.
management.endpoint.health.show-details=when-authorized
# SE-24: /health STATUS stays public (probes still work), but its DETAILS (reconciler counts,
# exception class names) are shown only to a PLATFORM_ADMIN — not to any authenticated USER.
management.endpoint.health.roles=PLATFORM_ADMIN

# ===============================
# ECS / Fargate (FL Server orchestration)
# ===============================
# NOTE: the ECS/Fargate managed-task path is unimplemented (FlowerServerManager fails closed).
# Setting ecs.cluster-name will make POST /start throw until that path is built; leave blank to
# use local processes. The dead ecs.* settings (task-definition/subnets/…) were removed with the
# dead code and stay out until the orchestration path is built (sibling Transport/Orchestration WS).
ecs.cluster-name=${ECS_CLUSTER_NAME:}

# ===============================
# Email / SMTP (identity-foundations email stack)
# ===============================
app.email.provider=smtp
app.email.from=${APP_EMAIL_FROM:noreply@fedlearn.io}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Email test smoke endpoint (POST /api/admin/test-email)
# Disabled by default; flip APP_EMAIL_TEST_ENDPOINT_ENABLED=true to enable.
# ===============================
app.email.test-endpoint.enabled=${APP_EMAIL_TEST_ENDPOINT_ENABLED:false}
