# ============================================================================
# DEV PROFILE — local-machine convenience defaults.
#
# Activated by:
#   ./gradlew bootRun --args="--spring.profiles.active=dev"
#   SPRING_PROFILES_ACTIVE=dev ./gradlew bootRun
#   launch_all.sh (already exports SPRING_PROFILES_ACTIVE=dev)
#
# IMPORTANT: never activate this profile in any deployed environment. The
# secrets here are PUBLIC (this file is checked into git) — they exist only
# so a fresh clone can `bootRun` without first wrangling env vars.
#
# The base profile (application.properties) deliberately has no fallbacks
# for these values. If you forget `--spring.profiles.active=dev` and also
# don't set the env vars, the app will refuse to start. That's the point.
# ============================================================================

# ───────────────────────────────────────────────────────────────────────────
# H2 web console — enabled ONLY here. SecurityConfig also gates the URL
# pattern behind the dev profile, so even an accidental enablement cannot
# expose the console in production.
# ───────────────────────────────────────────────────────────────────────────
spring.h2.console.enabled=true

# ───────────────────────────────────────────────────────────────────────────
# Local-dev secrets. Public, base64 padding to 32 bytes for HMAC-SHA256.
# ───────────────────────────────────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2QhIQ==}
app.internal.api-key=${APP_INTERNAL_API_KEY:dev-only-internal-key-do-not-use-in-prod}

# ───────────────────────────────────────────────────────────────────────────
# CORS — permissive localhost patterns for Vite (any port), Electron, etc.
# ───────────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*,file://}

# ───────────────────────────────────────────────────────────────────────────
# Cookie defaults — secure=false so cookies survive HTTP local dev. Production
# overrides via env vars to secure=true and SameSite=Strict.
# ───────────────────────────────────────────────────────────────────────────
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${APP_AUTH_COOKIE_SAME_SITE:Lax}

# ───────────────────────────────────────────────────────────────────────────
# Loud startup banner so it's obvious when dev defaults are in effect.
# ───────────────────────────────────────────────────────────────────────────
logging.level.com.federated.fl_platform_api=DEBUG
