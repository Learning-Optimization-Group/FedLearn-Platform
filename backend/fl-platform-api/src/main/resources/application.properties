spring.application.name=fl-platform-api
server.port=8081
server.address=0.0.0.0

# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/federated_platform_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:federated_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE — schema owned by Flyway; Hibernate only validates.
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Flyway — baseline-on-migrate lets us adopt existing (ddl-auto) dev DBs
# without dropping them; first run stamps current state as V1.
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.cors=INFO

# ===============================
# JWT Configuration
# ===============================
# Fails fast if APP_JWT_SECRET is not set in the environment.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===============================
# Internal API key (required for /api/internal/** callbacks from FL-server tasks).
# Empty in dev defaults so local runs fail fast if you forget to set it.
# ===============================
app.internal.api-key=${APP_INTERNAL_API_KEY:}

# URL the FL-server Fargate task uses to reach THIS backend for callbacks.
# In production this must be an internal (VPC-reachable) ALB or Cloud Map DNS name;
# in dev it falls back to SERVER_HOST:8081 inside the FL-server process.
app.backend.internal-url=${APP_BACKEND_INTERNAL_URL:}

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ===============================
# ECS / Fargate (FL Server orchestration)
# ===============================
ecs.cluster-name=${ECS_CLUSTER_NAME:}
ecs.task-definition=${ECS_TASK_DEFINITION:}
ecs.subnets=${ECS_SUBNETS:}
ecs.security-groups=${ECS_SECURITY_GROUPS:}
ecs.assign-public-ip=${ECS_ASSIGN_PUBLIC_IP:DISABLED}
ecs.container-name=${ECS_CONTAINER_NAME:fl-server-container}

# ===============================
# Legacy local-process Python paths (used by ModelInitializer for dev runs
# only — production uses the ECS Fargate FL-server path). Defaults cover
# local dev; production deploys override via PYTHON_* env vars if needed.
# ===============================
python.executable.path=${PYTHON_EXECUTABLE_PATH:src/main/resources/scripts/run_init_model.sh}
python.flbat.path=${PYTHON_FLBAT_PATH:src/main/resources/scripts/run_fl_server.sh}
python.script.init-model.path=${PYTHON_SCRIPT_INIT_MODEL_PATH:src/main/resources/scripts/init_model.py}
python.script.fl-server.path=${PYTHON_SCRIPT_FL_SERVER_PATH:src/main/resources/scripts/run_fl_server.sh}
