spring.application.name=fl-platform-api
server.port=8081
server.address=0.0.0.0

# ===============================
# DATASOURCE — PostgreSQL for every profile (H2 has been retired). Defaults
# point at a local Postgres (see backend/fl-platform-api/docker-compose.yml:
# `docker compose up -d`); deployed envs override via SPRING_DATASOURCE_*.
# Tests use Testcontainers Postgres (see application-test.properties).
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/federance}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:federance}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:federance}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE — schema owned by Flyway; Hibernate only validates.
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Flyway — baseline-on-migrate lets us adopt existing (ddl-auto) dev DBs
# without dropping them; first run stamps current state as V1.
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ===============================
# Logging — dev defaults
# ===============================
# Root: INFO so app-level lifecycle is visible.
# Our packages: DEBUG locally so per-request / per-process detail shows up.
# Spring/Hibernate frameworks: trimmed to INFO/WARN to avoid noise.
logging.level.root=INFO
logging.level.com.federated.fl_platform_api=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.cors=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO

# Expose the loggers actuator so log levels can be flipped at runtime
# without a restart (locked down behind the security chain).
management.endpoints.web.exposure.include=health,loggers

# ===============================
# JWT Configuration
# ===============================
# No default — Spring fails fast on boot if APP_JWT_SECRET is unset, so a
# misconfigured deploy can never sign tokens with a known constant.
# Local devs activate the `dev` profile (or set the env var manually) — see
# application-dev.properties for the local fallback.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

# FL connection-token signing secret (SE-1/SE-7). Defaults to app.jwt.secret for backward-compat, but
# set a DISTINCT APP_FL_TOKEN_SECRET in deployed profiles so a compromise of the network-facing FL
# server cannot forge web-auth sessions (the FL child never receives APP_JWT_SECRET — it is scrubbed).
app.fl.token-secret=${APP_FL_TOKEN_SECRET:${app.jwt.secret}}
# FL connection-token lifetime (seconds). The token rides on EVERY gRPC call, so it must outlive the
# whole run, not just the handshake — raised from 120s. Signed with app.fl.token-secret. This is the
# FLOOR: a run's token is actually sized to the run (SE-14) — max(ttl-seconds, numRounds*per-round-seconds
# + startup-buffer-seconds), capped at max-ttl-seconds — so a long run can't expire its token mid-training
# and lock the client out once require-client-auth is on. Set per-round-seconds to match the FL server's
# FEDLEARN_ROUND_TIMEOUT_S. NOTE: max-ttl-seconds (24h default) is a hard ceiling — a run expected to
# run LONGER than it must raise the ceiling (or the token expires before the run ends and the client is
# dropped once require-client-auth is on); the ceiling exists so a huge numRounds can't mint a token
# valid for weeks.
app.fl.connection-token.ttl-seconds=${APP_FL_TOKEN_TTL_SECONDS:3600}
app.fl.connection-token.per-round-seconds=${APP_FL_TOKEN_PER_ROUND_SECONDS:600}
app.fl.connection-token.startup-buffer-seconds=${APP_FL_TOKEN_STARTUP_BUFFER_SECONDS:900}
app.fl.connection-token.max-ttl-seconds=${APP_FL_TOKEN_MAX_TTL_SECONDS:86400}
# Activate FL-boundary client-token enforcement (the FL server rejects tokenless clients). Keep FALSE
# until the client launchers pass FEDLEARN_CONNECTION_TOKEN, or clients are locked out.
app.fl.require-client-auth=${APP_FL_REQUIRE_CLIENT_AUTH:false}
# SE-2: require the FL server to serve gRPC over TLS (fail closed on plaintext). Keep FALSE until
# server certs are provisioned (FEDLEARN_GRPC_SERVER_KEY/CERT in the backend env) — flipping it
# without certs makes the FL server refuse to start.
app.fl.require-tls=${APP_FL_REQUIRE_TLS:false}
# SE-14: on a deployed profile (ec2demo/production), require-client-auth=true with require-tls=false is
# refused at boot (FlBoundaryAuthPolicyValidator) — the connection token would ride plaintext gRPC over
# the WAN and be replayable. Set this TRUE only to acknowledge a trusted network (Tailscale / loopback /
# private VPC) where the wire is already encrypted outside gRPC. Default FALSE (fail closed).
app.fl.allow-plaintext-client-auth=${APP_FL_ALLOW_PLAINTEXT_CLIENT_AUTH:false}
# SE-12: issue a short-lived per-client mTLS cert (CN=userId) at enrollment, so an FL client proves an
# identity the platform ISSUED (rate-limitable + revocable) instead of an anonymous, only-TTL-bounded
# token. Default OFF: turning it on also requires pointing the FL server's FEDLEARN_GRPC_ROOT_CERT at
# this CA (app.fl.client-ca.cert-pem) and flipping app.fl.require-client-auth, else nothing enforces it.
# If enabled with no CA configured, an EPHEMERAL in-memory CA is generated (certs die on restart) — set
# a stable CA PEM pair in any deployed profile.
feature.fl-client-cert.enabled=${FEATURE_FL_CLIENT_CERT:false}
app.fl.client-ca.cert-pem=${APP_FL_CLIENT_CA_CERT_PEM:}
app.fl.client-ca.key-pem=${APP_FL_CLIENT_CA_KEY_PEM:}
app.fl.client-cert.validity-seconds=${APP_FL_CLIENT_CERT_VALIDITY_SECONDS:86400}

# Cookie settings — secure=false and sameSite=Lax for local HTTP dev.
# In production, override to secure=true and sameSite=Strict.
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${APP_AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie.max-age-seconds=${APP_AUTH_COOKIE_MAX_AGE:86400}

# ===============================
# CORS
# ===============================
# No default — boots fail without an explicit allowlist. Local dev gets a
# permissive list from application-dev.properties; production MUST set
# CORS_ALLOWED_ORIGINS to an explicit comma-separated list of fully-qualified
# origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===============================
# Internal API key (required for /api/internal/** callbacks from FL-server tasks).
# No default — fails fast on boot if APP_INTERNAL_API_KEY is unset.
# ===============================
app.internal.api-key=${APP_INTERNAL_API_KEY}

# URL the FL-server Fargate task uses to reach THIS backend for callbacks.
# In production this must be an internal (VPC-reachable) ALB or Cloud Map DNS name;
# in dev it falls back to SERVER_HOST:8081 inside the FL-server process.
app.backend.internal-url=${APP_BACKEND_INTERNAL_URL:}

# ===============================
# Actuator
# ===============================
# management.endpoints.web.exposure.include is set in the Logging section above.
management.endpoint.health.show-details=when-authorized

# ===============================
# ECS / Fargate (FL Server orchestration)
# ===============================
# NOTE: the ECS/Fargate path is NOT implemented — FlServerManager fails closed
# (UnsupportedOperationException) if ecs.cluster-name is non-blank. Leave it blank to run
# FL servers as local processes. Other ecs.* settings were removed with the dead code.
ecs.cluster-name=${ECS_CLUSTER_NAME:}

# ===============================
# Legacy local-process Python paths (used by ModelInitializer for dev runs
# only — production uses the ECS Fargate FL-server path). Defaults cover
# local dev; production deploys override via PYTHON_* env vars if needed.
# ===============================
python.executable.path=${PYTHON_EXECUTABLE_PATH:../../fl-runtime/run_init_model.sh}
python.flbat.path=${PYTHON_FLBAT_PATH:../../fl-runtime/run_fl_server.sh}
python.script.init-model.path=${PYTHON_SCRIPT_INIT_MODEL_PATH:../../fl-runtime/init_model.py}
python.script.fl-server.path=${PYTHON_SCRIPT_FL_SERVER_PATH:../../fl-runtime/run_fl_server.sh}
python.script.infer.path=${PYTHON_SCRIPT_INFER_PATH:../../fl-runtime/run_infer.sh}
python.script.recipes.path=${PYTHON_SCRIPT_RECIPES_PATH:../../fl-runtime/run_recipes.sh}

# On-device training model-bundle delivery (mobile FL client, e2e training P2). Root dir of the per-run
# bundles staged by scripts/stage_model_bundle.py; served by GET /api/runs/{id}/model-bundle + /files/{name}.
app.model-bundle.dir=${APP_MODEL_BUNDLE_DIR:/var/models}
feature.model-bundle-delivery.enabled=${FEATURE_MODEL_BUNDLE_DELIVERY:true}
# MO-15 / BA-16: recipe-aware auto-stage of a run's bundle at start (ProjectService ->
# ScriptModelBundleStager) so a phone that joins finds it with ZERO manual staging.
#   - fixture-backed recipes (fixture-recipes below, e.g. TINYNET_GOLDEN): stdlib-only fixture copy via
#     scripts/stage_model_bundle.py <runId> --out <dir> — NO ExecuTorch toolchain needed.
#   - every other recipe: best-effort real export via scripts/export_model.py <runId> --recipe <key>
#     --out <dir> (torch + executorch); without the toolchain it exits non-zero and the phone 404s
#     gracefully, exactly as before.
# Default ON now that the common path is dependency-free (BA-16); best-effort + idempotent, so a failure
# never fails a start. Flip the flag off to disable auto-stage entirely.
feature.model-bundle-autostage.enabled=${FEATURE_MODEL_BUNDLE_AUTOSTAGE:true}
python.script.export-model.path=${EXPORT_MODEL_SCRIPT:scripts/export_model.py}
python.script.stage-model-bundle.path=${STAGE_MODEL_BUNDLE_SCRIPT:scripts/stage_model_bundle.py}
app.model-bundle.autostage.fixture-recipes=${MODEL_BUNDLE_FIXTURE_RECIPES:TINYNET_GOLDEN}
app.model-bundle.autostage.python=${MODEL_BUNDLE_PYTHON:python3}
app.model-bundle.autostage.timeout-seconds=${MODEL_BUNDLE_STAGE_TIMEOUT:120}

# Inference ("Use a model") guardrails.
# max-concurrent: ceiling on simultaneous torch inference processes (excess -> 503).
# max-request-bytes: hard cap on the inference POST body, enforced before the body
#   is read (InferenceRequestSizeFilter) to bound per-request heap pressure.
inference.max-concurrent=${INFERENCE_MAX_CONCURRENT:2}
inference.max-request-bytes=${INFERENCE_MAX_REQUEST_BYTES:16777216}
inference.generation-timeout-seconds=${INFERENCE_GENERATION_TIMEOUT_SECONDS:300}

# Hostname returned to FL clients in /api/client/projects/{id}/connection.
# Defaults to localhost for desktop dev; deployed envs (ec2demo, production)
# override via FL_SERVER_GRPC_HOST.
app.fl-server.grpc-host=${FL_SERVER_GRPC_HOST:localhost}

# BA-16: when grpc-host is left at the default 'localhost' in the dev profile, the backend auto-detects a
# client-reachable IP to advertise. This flag orders the preference when both are present: true (default)
# prefers a Tailscale/CGNAT 100.64.0.0/10 address (reachable across the whole tailnet — what cross-network
# demo devices dial); false prefers a site-local LAN IP. An explicit FL_SERVER_GRPC_HOST always wins.
app.fl-server.prefer-cgnat=${FL_SERVER_PREFER_CGNAT:true}

# ===============================
# Configurable Port Range for Local Server
# ===============================
fl.server.port-range.start=${FL_PORT_RANGE_START:50000}
fl.server.port-range.end=${FL_PORT_RANGE_END:50010}
fl.server.startup-probe-seconds=${FL_SERVER_STARTUP_PROBE_SECONDS:3}
fl.server.stdout-drain-millis=${FL_SERVER_STDOUT_DRAIN_MILLIS:5000}

# ===============================
# Model-artifact registry (DA-1/DA-2)
# ===============================
# Where LocalFsArtifactBlobStore writes content-addressed blobs (sha256 fan-out).
app.artifact-store.root=${FEDLEARN_ARTIFACT_STORE_ROOT:artifact-store}
# BA-11 Chunk A: inference materializes a project's registry head model (FULL_CHECKPOINT) here, keyed by
# its sha256, then hands infer.py that path — so inference reads the content-addressed registry (the
# source of truth) instead of the overwritable .npz. Immutable content ⇒ files are reused, never stale.
app.model-blob-cache.dir=${APP_MODEL_BLOB_CACHE_DIR:models/blob-cache}
# fl_server.py posts a run's final model here (POST /api/internal/projects/{id}/artifacts).
# In-memory multipart for now; streaming very large checkpoints is a later optimization.
spring.servlet.multipart.max-file-size=${FEDLEARN_MAX_ARTIFACT_SIZE:2GB}
spring.servlet.multipart.max-request-size=${FEDLEARN_MAX_ARTIFACT_SIZE:2GB}

# =================════════════════════════════════════
# Feature Flags — env-var driven, default = fully enabled
# =================════════════════════════════════════
feature.log-persistence.enabled=${FEATURE_LOG_PERSISTENCE:true}
feature.round-result-reporting.enabled=${FEATURE_ROUND_RESULTS:true}

# ===============================
# Bootstrap (see BootstrapRunner) — seeds first PLATFORM_ADMIN + Platform org
# on an empty database. All values blank by default → runner no-ops at startup.
# ===============================
app.bootstrap.admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.platform-org-name=${APP_BOOTSTRAP_PLATFORM_ORG_NAME:Platform}
