spring.application.name=fl-platform-api
server.port=8081
server.address=0.0.0.0

# ===============================
# DATASOURCE — PostgreSQL for every profile (H2 has been retired). Defaults
# point at a local Postgres (see backend/fl-platform-api/docker-compose.yml:
# `docker compose up -d`); deployed envs override via SPRING_DATASOURCE_*.
# Tests use Testcontainers Postgres (see application-test.properties).
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/federance}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:federance}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:federance}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE — schema owned by Flyway; Hibernate only validates.
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Flyway — baseline-on-migrate lets us adopt existing (ddl-auto) dev DBs
# without dropping them; first run stamps current state as V1.
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ===============================
# Logging — dev defaults
# ===============================
# Root: INFO so app-level lifecycle is visible.
# Our packages: DEBUG locally so per-request / per-process detail shows up.
# Spring/Hibernate frameworks: trimmed to INFO/WARN to avoid noise.
logging.level.root=INFO
logging.level.com.federated.fl_platform_api=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.cors=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO

# Expose the loggers actuator so log levels can be flipped at runtime
# without a restart (locked down behind the security chain).
management.endpoints.web.exposure.include=health,loggers

# ===============================
# JWT Configuration
# ===============================
# No default — Spring fails fast on boot if APP_JWT_SECRET is unset, so a
# misconfigured deploy can never sign tokens with a known constant.
# Local devs activate the `dev` profile (or set the env var manually) — see
# application-dev.properties for the local fallback.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

# Short-lived FL connection-token lifetime (seconds). Reuses app.jwt.secret.
app.fl.connection-token.ttl-seconds=120

# Cookie settings — secure=false and sameSite=Lax for local HTTP dev.
# In production, override to secure=true and sameSite=Strict.
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${APP_AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie.max-age-seconds=${APP_AUTH_COOKIE_MAX_AGE:86400}

# ===============================
# CORS
# ===============================
# No default — boots fail without an explicit allowlist. Local dev gets a
# permissive list from application-dev.properties; production MUST set
# CORS_ALLOWED_ORIGINS to an explicit comma-separated list of fully-qualified
# origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===============================
# Internal API key (required for /api/internal/** callbacks from FL-server tasks).
# No default — fails fast on boot if APP_INTERNAL_API_KEY is unset.
# ===============================
app.internal.api-key=${APP_INTERNAL_API_KEY}

# URL the FL-server Fargate task uses to reach THIS backend for callbacks.
# In production this must be an internal (VPC-reachable) ALB or Cloud Map DNS name;
# in dev it falls back to SERVER_HOST:8081 inside the FL-server process.
app.backend.internal-url=${APP_BACKEND_INTERNAL_URL:}

# ===============================
# Actuator
# ===============================
# management.endpoints.web.exposure.include is set in the Logging section above.
management.endpoint.health.show-details=when-authorized

# ===============================
# ECS / Fargate (FL Server orchestration)
# ===============================
# NOTE: the ECS/Fargate path is NOT implemented — FlowerServerManager fails closed
# (UnsupportedOperationException) if ecs.cluster-name is non-blank. Leave it blank to run
# FL servers as local processes. Other ecs.* settings were removed with the dead code.
ecs.cluster-name=${ECS_CLUSTER_NAME:}

# ===============================
# Legacy local-process Python paths (used by ModelInitializer for dev runs
# only — production uses the ECS Fargate FL-server path). Defaults cover
# local dev; production deploys override via PYTHON_* env vars if needed.
# ===============================
python.executable.path=${PYTHON_EXECUTABLE_PATH:src/main/resources/scripts/run_init_model.sh}
python.flbat.path=${PYTHON_FLBAT_PATH:src/main/resources/scripts/run_fl_server.sh}
python.script.init-model.path=${PYTHON_SCRIPT_INIT_MODEL_PATH:src/main/resources/scripts/init_model.py}
python.script.fl-server.path=${PYTHON_SCRIPT_FL_SERVER_PATH:src/main/resources/scripts/run_fl_server.sh}
python.script.infer.path=${PYTHON_SCRIPT_INFER_PATH:src/main/resources/scripts/run_infer.sh}
python.script.recipes.path=${PYTHON_SCRIPT_RECIPES_PATH:src/main/resources/scripts/run_recipes.sh}

# Inference ("Use a model") guardrails.
# max-concurrent: ceiling on simultaneous torch inference processes (excess -> 503).
# max-request-bytes: hard cap on the inference POST body, enforced before the body
#   is read (InferenceRequestSizeFilter) to bound per-request heap pressure.
inference.max-concurrent=${INFERENCE_MAX_CONCURRENT:2}
inference.max-request-bytes=${INFERENCE_MAX_REQUEST_BYTES:16777216}

# Hostname returned to FL clients in /api/client/projects/{id}/connection.
# Defaults to localhost for desktop dev; deployed envs (ec2demo, production)
# override via FL_SERVER_GRPC_HOST.
app.fl-server.grpc-host=${FL_SERVER_GRPC_HOST:localhost}

# ===============================
# Configurable Port Range for Local Server
# ===============================
fl.server.port-range.start=${FL_PORT_RANGE_START:50000}
fl.server.port-range.end=${FL_PORT_RANGE_END:50010}
fl.server.startup-probe-seconds=${FL_SERVER_STARTUP_PROBE_SECONDS:3}
fl.server.stdout-drain-millis=${FL_SERVER_STDOUT_DRAIN_MILLIS:5000}

# =================════════════════════════════════════
# Feature Flags — env-var driven, default = fully enabled
# =================════════════════════════════════════
feature.log-persistence.enabled=${FEATURE_LOG_PERSISTENCE:true}
feature.round-result-reporting.enabled=${FEATURE_ROUND_RESULTS:true}

# ===============================
# Bootstrap (see BootstrapRunner) — seeds first PLATFORM_ADMIN + Platform org
# on an empty database. All values blank by default → runner no-ops at startup.
# ===============================
app.bootstrap.admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.platform-org-name=${APP_BOOTSTRAP_PLATFORM_ORG_NAME:Platform}
