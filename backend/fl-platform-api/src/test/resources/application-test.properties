# ============================================================================
# TEST PROFILE — the authoritative test config (this file, on the test
# classpath, is what @ActiveProfiles("test") loads).
#
# Tests run against real PostgreSQL via Testcontainers. The `jdbc:tc:` URL
# scheme makes the Testcontainers driver start/reuse one postgres:16-alpine
# container for the JVM run — no manual container management, and tests run on
# the same engine as prod. Requires a working Docker daemon. H2 is retired.
# ============================================================================
spring.datasource.url=jdbc:tc:postgresql:16.6-alpine:///fedlearn_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# Cap the HikariCP pool PER Spring context. The suite builds ~20 cached @SpringBootTest contexts
# that all pool against the single shared `fedlearn_test` container (Postgres max_connections≈100).
# At Hikari's default pool size (10) the summed pools overshoot 100 and a context fails to start
# with a "too many clients" connection error under full-suite load (each context passes in
# isolation). A small max + zero idle connections keeps the total well under the limit and makes the
# suite robust as more contexts are added (e.g. any test carrying its own @TestPropertySource).
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0

# Schema is built from the JPA entities (create-drop) and dropped on context
# close, so @DirtiesContext gives each context a fresh DB — same isolation
# contract as the old H2 setup, now on Postgres. Flyway stays off for the bulk
# suite; the dedicated V*MigrationTest classes flip it on to exercise the real
# migrations against real Postgres.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Public test-only secrets — never used outside tests; safe to commit.
app.jwt.secret=bXlfc2VjcmV0X2tleV90aGF0X2lzX2F0X2xlYXN0XzMyX2J5dGVzX2xvbmc=
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost
app.internal.api-key=test-internal-key
# Artifact blob store writes under build/ (gitignored) in tests — never pollutes the source tree,
# and keeps the registry tests on the SHARED test context (no extra @TestPropertySource context).
app.artifact-store.root=build/test-artifact-store
# BA-3: don't run FL-server orphan reconciliation from the ApplicationRunner under test — it would
# reap runs across the shared Testcontainers DB. Tests drive StartupReconciler.reconcile() directly.
app.fl.reconcile-on-startup=false
