syntax = "proto3";

// Execution contract v1: what a participant must execute for one run.
//
// Specification: wikis/mobile/03-android-execution-contract-v1-design.md. The contract is immutable
// once published and describes the run, not a device: a participant still needs a compatible
// artifact, a local dataset and a passing qualification before it trains.
//
// Rules shared by every reader:
// - A successful parse is not acceptance. Readers apply the v1 validation rules
//   (framework/tests/fixtures/execution_contract_v1/README.md) before downloading a model or
//   opening local data.
// - Enum value 0 and numeric values this schema does not define are never accepted.
// - Fields declared `optional` carry explicit presence. Where such a field is required, absence is
//   invalid even when zero or false would be a legal value; nothing behavioral is defaulted.
// - Unknown fields are ignored. Adding mandatory behavior requires a new contract_version.
// - There is no protobuf map and no Any: order-sensitive data is carried by repeated fields.
package fedlearn.contract.v1;

option java_multiple_files = true;
option java_outer_classname = "ExecutionContractProto";
option java_package = "com.fedlearn.contract.v1";

message ExecutionContract {
  // Exactly 1. A reader never interprets another version as v1.
  uint32 contract_version = 1;
  // Minimum control/round protocol a client must speak (fedlearn.v2 RegisterClient
  // protocol_version).
  uint32 min_client_protocol_version = 2;
  // Canonical lowercase UUIDs; they must match the enrollment that delivered the contract.
  string run_id = 3;
  string project_id = 4;
  Recipe recipe = 5;
  Strategy strategy = 6;
  uint32 num_rounds = 7;
  uint32 clients_per_round = 8;
  Partitioning partitioning = 9;
  // Absent when the run has no seed.
  optional uint64 seed = 10;
  RoundPolicy round = 11;
  SecurityPolicy security = 12;
  oneof workload {
    ModelTraining model_training = 13;
    // A Federation-over-Text workload needs its own reviewed schema; it is not a model update.
  }
}

// Registry identifiers. A value here is not a claim that v1 can execute it: only the combinations
// in the approved v1 matrix are publishable.
enum Recipe {
  RECIPE_UNSPECIFIED = 0;
  RECIPE_TINYNET_GOLDEN = 1;
  RECIPE_MLP = 2;
  RECIPE_CNN = 3;
  RECIPE_PNEUMONIA_CNN = 4;
  RECIPE_CIFAR_RESNET18 = 5;
  RECIPE_TRANSFORMER = 6;
  RECIPE_LLM_LORA = 7;
}

enum Strategy {
  STRATEGY_UNSPECIFIED = 0;
  STRATEGY_DECOMFL = 1;
  STRATEGY_FEDAVG = 2;
  STRATEGY_FEDPROX = 3;
  STRATEGY_FEDOPT = 4;
  STRATEGY_ROBUST = 5;
}

enum Partitioning {
  PARTITIONING_UNSPECIFIED = 0;
  // The server assigns each participant a partition of a known dataset.
  PARTITIONING_SHARDED = 1;
  // Each participant trains on data it selected locally.
  PARTITIONING_LOCAL = 2;
}

enum Arm {
  ARM_UNSPECIFIED = 0;
  ARM_FULL = 1;
  ARM_FROZEN_HEAD = 2;
  ARM_OVA_LP = 3;
}

enum Task {
  TASK_UNSPECIFIED = 0;
  TASK_VECTOR_CLASSIFICATION = 1;
  TASK_IMAGE_CLASSIFICATION = 2;
  TASK_SEQUENCE_CLASSIFICATION = 3;
  TASK_CAUSAL_LM = 4;
}

enum Objective {
  OBJECTIVE_UNSPECIFIED = 0;
  // Softmax cross-entropy over class logits, mean-reduced over the batch.
  OBJECTIVE_CROSS_ENTROPY = 1;
  OBJECTIVE_ONE_VS_ALL = 2;
  OBJECTIVE_CAUSAL_LM = 3;
}

enum UpdateProtocol {
  UPDATE_UNSPECIFIED = 0;
  // DeComFL seeds and gradient scalars; no weights leave the device.
  UPDATE_DECOMFL_SCALAR = 1;
  // The trainable state in `ModelTraining.trainable` order, float32 safetensors.
  UPDATE_TRAINABLE_STATE_F32 = 2;
}

enum Transport {
  TRANSPORT_UNSPECIFIED = 0;
  TRANSPORT_TLS_REQUIRED = 1;
  TRANSPORT_PLAINTEXT_DEV = 2;
}

enum ClientAuth {
  CLIENT_AUTH_UNSPECIFIED = 0;
  CLIENT_AUTH_CONNECTION_TOKEN = 1;
  CLIENT_AUTH_DISABLED_DEV = 2;
}

enum SecureAggregation {
  SECAGG_UNSPECIFIED = 0;
  SECAGG_NONE = 1;
  // LightSecAgg over DeComFL gradient scalars. Weight updates have no secure aggregation.
  SECAGG_LIGHTSECAGG_SCALAR = 2;
}

enum ArtifactBackend {
  BACKEND_UNSPECIFIED = 0;
  BACKEND_EXECUTORCH_CPU = 1;
  BACKEND_EXECUTORCH_GPU = 2;
  BACKEND_EXECUTORCH_VENDOR = 3;
}

enum DType {
  DTYPE_UNSPECIFIED = 0;
  DTYPE_F32 = 1;
}

enum BatchOrder {
  BATCH_ORDER_UNSPECIFIED = 0;
  // Examples are visited in dataset order every epoch.
  BATCH_ORDER_SEQUENTIAL = 1;
  // Examples are reshuffled at the start of every epoch. The permutation is local to the
  // participant and is not reproducible across runtimes.
  BATCH_ORDER_SHUFFLED_EACH_EPOCH = 2;
  // Examples are visited in a permutation redrawn each epoch that every runtime reproduces exactly, so a
  // participant's update can be replayed from its data. All arithmetic is on unsigned 64-bit integers mod 2^64:
  //   mix(z)  = z += 0x9E3779B97F4A7C15; z = (z ^ (z >> 30)) * 0xBF58476D1CE4E5B9;
  //             z = (z ^ (z >> 27)) * 0x94D049BB133111EB; return z ^ (z >> 31)
  //   state   = mix(mix(mix(seed) ^ round) ^ epoch), where seed is ExecutionContract.seed (0 when absent),
  //             round is the server round being trained (from 1) and epoch the local epoch within it (from 0)
  //   next()  = r = mix(state); state += 0x9E3779B97F4A7C15; return r          (SplitMix64)
  //   below(b) = draw r = next() until r < 2^64 - (2^64 mod b); return r mod b (no modulo bias)
  //   order   = [0, 1, ..., n-1]; for i = n-1 down to 1: swap(order[i], order[below(i + 1)])  (Fisher-Yates)
  // Batches are consecutive batch_size slices of order; the last one is kept unless drop_last.
  BATCH_ORDER_SEEDED_PERMUTATION_V1 = 3;
}

message RoundPolicy {
  // Duration. The live absolute deadline comes from server status and always takes precedence.
  uint64 timeout_ms = 1;
  // Must be true in v1: the server accepts at most one update per participant per round.
  bool one_accepted_update_per_round = 2;
  // Retries of transient failures only; never a retrain or re-upload after acceptance.
  optional uint32 max_transient_retries = 3;
  uint64 retry_backoff_ms = 4;
}

message SecurityPolicy {
  // The effective deployment settings of the run, not a project's requested settings.
  Transport transport = 1;
  ClientAuth client_auth = 2;
  SecureAggregation secure_aggregation = 3;
  // Present exactly when secure_aggregation is SECAGG_LIGHTSECAGG_SCALAR.
  optional uint32 secure_agg_threshold = 4;
  // Present exactly when the server applies central differential privacy.
  CentralDp central_dp = 5;
}

// Server-side clipping, noise and accounting on the aggregate. It does not hide an individual
// update from the server and implies no local differential privacy.
message CentralDp {
  double target_epsilon = 1;
  double delta = 2;
  double clip_norm = 3;
}

message ModelTraining {
  // Stable model identifier and immutable revision; never a mutable project name.
  string model_id = 1;
  string model_revision = 2;
  Arm arm = 3;
  Task task = 4;
  Objective objective = 5;
  UpdateProtocol update_protocol = 6;
  // Canonical order: the Python model's named_parameters() filtered to requires_grad. Readers
  // match tensors by name, shape and dtype, never by the order a transport happens to use.
  repeated TensorSpec trainable = 7;
  // SHA-256 of the canonical frozen-state artifact and of the initial federated-state artifact.
  string frozen_state_sha256 = 8;
  string initial_state_sha256 = 9;
  LocalTraining local_training = 10;
  DataRequirement data = 11;
  repeated ArtifactVariant artifacts = 12;
  // Present exactly when the strategy is STRATEGY_FEDPROX.
  optional double fedprox_mu = 13;
  // The model's dropout layers in forward order, and how each draws its masks. Empty when the model has none. A
  // participant applies exactly these masks, so a training step is reproducible from the contract and the data.
  repeated DropoutLayer dropout = 14;
}

message DropoutLayer {
  // The dropout module's name in the model (named_modules()), e.g. "dropout1".
  string module = 1;
  // The probability of dropping an element, in [0, 1).
  double rate = 2;
  DropoutMasks masks = 3;
}

enum DropoutMasks {
  DROPOUT_MASKS_UNSPECIFIED = 0;
  // Masks every runtime reproduces. For local SGD step `step` of a round (counted from 0 across the round's epochs)
  // and the layer at index `layer` of ModelTraining.dropout, with the SplitMix64 mix() of
  // BATCH_ORDER_SEEDED_PERMUTATION_V1:
  //   state = mix(mix(mix(mix(seed) ^ round) ^ step) ^ layer)   (seed = ExecutionContract.seed, 0 when absent)
  //   the layer's activation elements, in row-major order, each take one draw r = next() of that stream;
  //   u = (r >> 11) * 2^-53; the element is dropped (0) iff u < rate, and kept elements are multiplied by
  //   float32(1) / float32(1 - rate), the inverted-dropout scale.
  DROPOUT_MASKS_SEEDED_V1 = 1;
}

message TensorSpec {
  string name = 1;
  // At least one dimension. A zero-dimensional parameter is declared as [1], matching the wire.
  repeated uint64 shape = 2;
  DType dtype = 3;
}

message LocalTraining {
  uint32 local_epochs = 1;
  // Absent means every batch of every epoch is trained.
  optional uint32 max_local_steps = 2;
  // Absent means no gradient clipping.
  optional double gradient_clip_norm = 3;
  oneof optimizer {
    Sgd sgd = 4;
    Adam adam = 5;
    AdamW adamw = 6;
    Rmsprop rmsprop = 7;
    // DeComFL: zeroth-order training. Steps are counted by it, so local_epochs is 0 and max_local_steps absent.
    ZerothOrderSgd zeroth_order_sgd = 12;
  }
  // Whether optimizer state starts fresh every server round.
  optional bool reset_optimizer_each_round = 8;
  // Examples per optimizer step.
  uint32 batch_size = 9;
  // Whether an incomplete final batch is skipped rather than trained.
  optional bool drop_last = 10;
  BatchOrder batch_order = 11;
}

// torch.optim.SGD semantics.
message Sgd {
  double learning_rate = 1;
  optional double momentum = 2;
  optional double dampening = 3;
  optional double weight_decay = 4;
  optional bool nesterov = 5;
}

// torch.optim.Adam semantics.
message Adam {
  double learning_rate = 1;
  double beta1 = 2;
  double beta2 = 3;
  double epsilon = 4;
  optional double weight_decay = 5;
  optional bool amsgrad = 6;
}

// torch.optim.AdamW semantics (decoupled weight decay).
message AdamW {
  double learning_rate = 1;
  double beta1 = 2;
  double beta2 = 3;
  double epsilon = 4;
  optional double weight_decay = 5;
  optional bool amsgrad = 6;
}

// torch.optim.RMSprop semantics.
message Rmsprop {
  double learning_rate = 1;
  double alpha = 2;
  double epsilon = 3;
  optional double weight_decay = 4;
  optional double momentum = 5;
  optional bool centered = 6;
}

// DeComFL's client update: SGD along random directions, the directional derivatives estimated by finite
// differences. Each round the server issues the seeds, a num_local_steps x num_perturbations matrix; every other
// number is stated here, and a round whose server config disagrees with it is refused before upload.
message ZerothOrderSgd {
  // eta. After each local step's num_perturbations draws: x -= (eta / num_perturbations) * sum_p g_p * z_p.
  double learning_rate = 1;
  // mu, the finite-difference step: g = (L(x + mu z) - L(x)) / mu for the forward estimator.
  double smoothing = 2;
  // K. Each step trains on the next batch of the local loader, cycling it.
  uint32 num_local_steps = 3;
  // P, directions per local step.
  uint32 num_perturbations = 4;
  GradientEstimator estimator = 5;
  PerturbationRng rng = 6;
}

enum GradientEstimator {
  ESTIMATOR_UNSPECIFIED = 0;
  // g = (L(x + mu z) - L(x)) / mu.
  ESTIMATOR_FORWARD = 1;
  // g = (L(x + mu z) - L(x - mu z)) / (2 mu).
  ESTIMATOR_CENTRAL = 2;
}

// How a perturbation z is drawn from its seed. Participants whose generators are not byte-identical estimate
// derivatives along different directions, and the aggregate is silently wrong.
enum PerturbationRng {
  RNG_UNSPECIFIED = 0;
  // Standard normal float32 of the trainable size, from a CPU torch.Generator seeded with the seed (torch.randn).
  RNG_TORCH_CPU_RANDN_F32 = 1;
}

message DataRequirement {
  Task task = 1;
  // Shape of one sample, without a batch dimension.
  repeated uint64 input_shape = 2;
  DType input_dtype = 3;
  // Classification tasks only; zero for causal language modelling.
  uint32 class_count = 4;
  // Immutable, hash-bound schema identifier.
  string label_schema_id = 5;
  // Applied in order. Declarative only: no executable payload is ever accepted.
  repeated Transform transforms = 6;
  // Present exactly for text tasks.
  ArtifactRef tokenizer = 7;
  // Where each participant's training data comes from. A run on user data states LOCAL_SNAPSHOT; the server then
  // serves no training data. FIXTURE marks a run on the recipe's committed fixture data (a test or demo run), which a
  // release client refuses.
  DataSource source = 8;
}

enum DataSource {
  DATA_SOURCE_UNSPECIFIED = 0;
  // An immutable dataset snapshot the participant imported on its own device.
  DATA_SOURCE_LOCAL_SNAPSHOT = 1;
  // The recipe's committed fixture data, served by the run's server. For tests and demos only.
  DATA_SOURCE_FIXTURE = 2;
}

// Closed v1 vocabulary. A new operation requires its own specification and a version review; an
// existing operation is never reinterpreted.
message Transform {
  oneof operation {
    IdentityVector identity_vector = 1;
    ImageToUnitTensor image_to_unit_tensor = 2;
    NormalizeChannels normalize_channels = 3;
  }
}

// The sample is already a float vector of exactly `width` elements.
message IdentityVector {
  uint32 width = 1;
}

// The sample is an 8-bit image of `height` x `width` x `channels` values, stored row-major with the channel
// innermost (HWC). It becomes a float32 tensor [channels, height, width] (CHW) whose element (c, y, x) is
//   float32(p) / float32(255)   with p the value at (y, x, c),
// one IEEE-754 binary32 division rounded to nearest-even: torchvision's ToTensor on a uint8 image. An image task
// states it first, and its [channels, height, width] must equal the requirement's input_shape.
message ImageToUnitTensor {
  uint32 height = 1;
  uint32 width = 2;
  // 1 (grayscale) or 3 (RGB, in that order).
  uint32 channels = 3;
}

// Per-channel normalisation of a CHW float32 tensor: element (c, y, x) becomes
//   (v - mean[c]) / std[c]
// as one binary32 subtraction then one binary32 division, each rounded to nearest-even, with mean and std the
// binary32 values stated here (torchvision's Normalize). Allowed only directly after ImageToUnitTensor, with one
// finite mean and one finite, positive std per channel.
message NormalizeChannels {
  repeated float mean = 1;
  repeated float std = 2;
}

message ArtifactRef {
  // Relative, normalized and traversal-free; unique within its variant.
  string relative_path = 1;
  string sha256 = 2;
  uint64 byte_size = 3;
}

message ArtifactVariant {
  string variant_id = 1;
  ArtifactBackend backend = 2;
  string abi = 3;
  repeated ArtifactRef files = 4;
  // Exact runtime operator identifiers, never a wildcard.
  repeated string required_operators = 5;
  uint64 declared_peak_memory_bytes = 6;
  uint64 declared_storage_bytes = 7;
  uint64 declared_probe_ms = 8;
  uint64 declared_train_ms = 9;
}

// Why a reader refused a contract. Every v1 reader reports the same codes for the same input.
enum ContractIssueCode {
  ISSUE_UNSPECIFIED = 0;
  // The bytes or ProtoJSON do not parse as an ExecutionContract.
  ISSUE_MALFORMED = 1;
  // contract_version is not 1. No other rule is evaluated.
  ISSUE_UNSUPPORTED_CONTRACT_VERSION = 2;
  // min_client_protocol_version is zero or newer than the reader.
  ISSUE_UNSUPPORTED_CLIENT_PROTOCOL = 3;
  // An enum is unspecified or has a value this reader does not define.
  ISSUE_UNKNOWN_ENUM = 4;
  // A required message, oneof or explicit-presence value is absent.
  ISSUE_MISSING_FIELD = 5;
  // A number is outside its v1 bounds or is not finite.
  ISSUE_OUT_OF_RANGE = 6;
  // An identifier is not in its canonical form.
  ISSUE_INVALID_IDENTIFIER = 7;
  // run_id or project_id differs from the enrollment that delivered the contract.
  ISSUE_IDENTITY_MISMATCH = 8;
  ISSUE_INVALID_HASH = 9;
  ISSUE_INVALID_PATH = 10;
  // Trainable tensor names, shapes, dtypes or counts are malformed.
  ISSUE_MALFORMED_LAYOUT = 11;
  // The recipe, arm, task, objective, update protocol and strategy are not an approved v1
  // combination.
  ISSUE_UNSUPPORTED_COMBINATION = 12;
  // Optimizer settings contradict each other.
  ISSUE_INVALID_OPTIMIZER = 13;
  // Security settings contradict each other or the update protocol.
  ISSUE_INVALID_SECURITY = 14;
  // A strategy-specific setting is present for the wrong strategy.
  ISSUE_INVALID_STRATEGY_SETTINGS = 15;
  // No artifact, no portable CPU artifact, or a variant without files.
  ISSUE_MISSING_ARTIFACT = 16;
  // Artifact metadata is duplicated, inconsistent or unbounded.
  ISSUE_INVALID_ARTIFACT = 17;
  // The data requirement disagrees with the task or with itself.
  ISSUE_INVALID_DATA_REQUIREMENT = 18;
}
