[pytest]
# `-m "not slow"` preserves the existing deselection convention (TE-4): the default run skips
# tests that download models or run full training. The --cov flags enable coverage measurement
# on every full-suite run and enforce a MODEST regression floor: measured line coverage is ~77%,
# so --cov-fail-under=73 guards against regression without being an aspirational target that
# fails today. (Running a hand-picked subset of tests will report low coverage and trip the
# floor by design — pass `--no-cov` for a subset run.)
addopts = -m "not slow" --cov=fedlearn --cov-report=term-missing --cov-fail-under=73
markers =
    slow: tests that download models or run full training (deselect with -m "not slow")
