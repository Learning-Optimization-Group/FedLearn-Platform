<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="700" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a2332">
    FedLearn Platform - System Architecture
  </text>
  
  <!-- Legend -->
  <g transform="translate(50, 50)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">Technology Stack:</text>
    <rect x="0" y="10" width="15" height="15" fill="#61DAFB"/>
    <text x="20" y="22" font-size="12" fill="#333">React 19</text>
    
    <rect x="100" y="10" width="15" height="15" fill="#6DB33F"/>
    <text x="120" y="22" font-size="12" fill="#333">Spring Boot 3</text>
    
    <rect x="240" y="10" width="15" height="15" fill="#336791"/>
    <text x="260" y="22" font-size="12" fill="#333">PostgreSQL</text>
    
    <rect x="360" y="10" width="15" height="15" fill="#3776AB"/>
    <text x="380" y="22" font-size="12" fill="#333">Python 3.10</text>
    
    <rect x="480" y="10" width="15" height="15" fill="#2496ED"/>
    <text x="500" y="22" font-size="12" fill="#333">Docker</text>
    
    <rect x="580" y="10" width="15" height="15" fill="#FF9900"/>
    <text x="600" y="22" font-size="12" fill="#333">AWS EC2</text>
  </g>

  <!-- Frontend Section -->
  <g id="frontend">
    <rect x="50" y="120" width="300" height="200" rx="10" fill="#61DAFB" fill-opacity="0.1" stroke="#61DAFB" stroke-width="2"/>
    <text x="200" y="145" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a2332">Frontend (Vercel)</text>
    
    <!-- React Component -->
    <rect x="70" y="160" width="260" height="60" rx="5" fill="#61DAFB" fill-opacity="0.3" stroke="#61DAFB" stroke-width="1.5"/>
    <text x="200" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a2332">React 19 + Vite</text>
    <text x="200" y="205" font-size="11" text-anchor="middle" fill="#333">Project Dashboard | Live Logs | Auth</text>
    
    <!-- WebSocket -->
    <rect x="70" y="235" width="120" height="40" rx="5" fill="#FFB84D" fill-opacity="0.3" stroke="#FFB84D" stroke-width="1.5"/>
    <text x="130" y="258" font-size="12" text-anchor="middle" fill="#333">STOMP/WebSocket</text>
    
    <!-- Axios -->
    <rect x="210" y="235" width="120" height="40" rx="5" fill="#5A29E4" fill-opacity="0.3" stroke="#5A29E4" stroke-width="1.5"/>
    <text x="270" y="258" font-size="12" text-anchor="middle" fill="#333">Axios (REST)</text>
  </g>

  <!-- Backend Section -->
  <g id="backend">
    <rect x="450" y="120" width="450" height="280" rx="10" fill="#FF9900" fill-opacity="0.1" stroke="#FF9900" stroke-width="2"/>
    <text x="675" y="145" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a2332">Backend (AWS EC2)</text>
    
    <!-- Spring Boot -->
    <rect x="470" y="160" width="200" height="100" rx="5" fill="#6DB33F" fill-opacity="0.3" stroke="#6DB33F" stroke-width="1.5"/>
    <text x="570" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a2332">Spring Boot 3 API</text>
    <text x="570" y="205" font-size="11" text-anchor="middle" fill="#333">JWT Auth | REST API</text>
    <text x="570" y="220" font-size="11" text-anchor="middle" fill="#333">WebSocket | Process Mgmt</text>
    <text x="570" y="240" font-size="10" text-anchor="middle" fill="#666">FlowerServerManager</text>
    
    <!-- PostgreSQL -->
    <rect x="690" y="160" width="190" height="100" rx="5" fill="#336791" fill-opacity="0.3" stroke="#336791" stroke-width="1.5"/>
    <text x="785" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a2332">PostgreSQL</text>
    <text x="785" y="205" font-size="11" text-anchor="middle" fill="#333">User | Project | Results</text>
    <text x="785" y="225" font-size="10" text-anchor="middle" fill="#666">JPA/Hibernate</text>
    
    <!-- Python FL Server -->
    <rect x="470" y="280" width="410" height="100" rx="5" fill="#3776AB" fill-opacity="0.3" stroke="#3776AB" stroke-width="1.5"/>
    <text x="675" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a2332">FedLearn Framework (Python)</text>
    <text x="675" y="325" font-size="11" text-anchor="middle" fill="#333">Custom FL Server | gRPC | FedAvg/DeComFL</text>
    <text x="675" y="345" font-size="10" font-weight="bold" text-anchor="middle" fill="#D32F2F">⚡ Parameter Chunking (>300MB) | Parallel Heartbeat</text>
    <text x="675" y="365" font-size="10" text-anchor="middle" fill="#666">Spawned by Spring Boot via ProcessBuilder</text>
  </g>

  <!-- Clients Section -->
  <g id="clients">
    <rect x="980" y="120" width="370" height="280" rx="10" fill="#2496ED" fill-opacity="0.1" stroke="#2496ED" stroke-width="2"/>
    <text x="1165" y="145" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a2332">FL Clients</text>
    
    <!-- Docker Client -->
    <rect x="1000" y="160" width="150" height="80" rx="5" fill="#2496ED" fill-opacity="0.3" stroke="#2496ED" stroke-width="1.5"/>
    <text x="1075" y="185" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">Docker Client</text>
    <text x="1075" y="205" font-size="10" text-anchor="middle" fill="#333">Containerized</text>
    <text x="1075" y="220" font-size="10" text-anchor="middle" fill="#333">Zero Install</text>
    
    <!-- Native Client -->
    <rect x="1170" y="160" width="150" height="80" rx="5" fill="#3776AB" fill-opacity="0.3" stroke="#3776AB" stroke-width="1.5"/>
    <text x="1245" y="185" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">Native Client</text>
    <text x="1245" y="205" font-size="10" text-anchor="middle" fill="#333">Python Script</text>
    <text x="1245" y="220" font-size="10" text-anchor="middle" fill="#333">Local Training</text>
    
    <!-- gRPC Communication -->
    <rect x="1000" y="260" width="330" height="120" rx="5" fill="#00C853" fill-opacity="0.2" stroke="#00C853" stroke-width="1.5"/>
    <text x="1165" y="285" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">gRPC Communication</text>
    
    <!-- Dual Stub -->
    <rect x="1020" y="300" width="140" height="60" rx="3" fill="#FFD54F" fill-opacity="0.4" stroke="#F57C00" stroke-width="1"/>
    <text x="1090" y="320" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Stub 1: Training</text>
    <text x="1090" y="335" font-size="9" text-anchor="middle" fill="#666">Send/Receive</text>
    <text x="1090" y="348" font-size="9" text-anchor="middle" fill="#666">Parameters</text>
    
    <rect x="1180" y="300" width="140" height="60" rx="3" fill="#FFD54F" fill-opacity="0.4" stroke="#F57C00" stroke-width="1"/>
    <text x="1250" y="320" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Stub 2: Heartbeat</text>
    <text x="1250" y="335" font-size="9" text-anchor="middle" fill="#666">Parallel Pings</text>
    <text x="1250" y="348" font-size="9" text-anchor="middle" fill="#666">Keep Alive</text>
  </g>

  <!-- Data Flow Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Frontend to Backend REST -->
  <path d="M 350 255 L 450 220" stroke="#5A29E4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="380" y="230" font-size="10" fill="#333">REST API</text>
  <text x="380" y="245" font-size="9" fill="#666">(JWT Auth)</text>
  
  <!-- Frontend to Backend WebSocket -->
  <path d="M 190 275 Q 300 400 470 350" stroke="#FFB84D" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <text x="300" y="380" font-size="10" fill="#333">WebSocket</text>
  <text x="300" y="395" font-size="9" fill="#666">(Live Logs)</text>
  
  <!-- Spring Boot to PostgreSQL -->
  <path d="M 670 210 L 690 210" stroke="#336791" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="675" y="200" font-size="9" fill="#333">JPA</text>
  
  <!-- Spring Boot to Python -->
  <path d="M 570 260 L 570 280" stroke="#3776AB" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="580" y="273" font-size="9" fill="#333">Process Spawn</text>
  
  <!-- Python to Clients -->
  <path d="M 880 330 L 980 220" stroke="#00C853" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="900" y="260" font-size="11" font-weight="bold" fill="#00C853">gRPC Port :5005X</text>
  <text x="900" y="275" font-size="9" fill="#666">Chunked Parameters</text>
  <text x="900" y="288" font-size="9" fill="#666">Dual Heartbeat</text>

  <!-- Key Features Box -->
  <g id="features">
    <rect x="50" y="450" width="850" height="420" rx="10" fill="#F5F5F5" stroke="#333" stroke-width="2"/>
    <text x="475" y="480" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a2332">Key Innovations & Features</text>
    
    <!-- Innovation 1 -->
    <g transform="translate(70, 500)">
      <circle cx="10" cy="10" r="8" fill="#D32F2F"/>
      <text x="25" y="15" font-size="13" font-weight="bold" fill="#1a2332">Built from Scratch</text>
      <text x="25" y="35" font-size="11" fill="#333">• Custom federated learning framework (not Flower-based)</text>
      <text x="25" y="50" font-size="11" fill="#333">• Full control over aggregation strategies and client-server protocol</text>
      <text x="25" y="65" font-size="11" fill="#333">• Implements FedAvg and DeComFL (Byzantine-robust) algorithms</text>
    </g>
    
    <!-- Innovation 2 -->
    <g transform="translate(70, 580)">
      <circle cx="10" cy="10" r="8" fill="#FF6F00"/>
      <text x="25" y="15" font-size="13" font-weight="bold" fill="#1a2332">Parameter Chunking (>300MB)</text>
      <text x="25" y="35" font-size="11" fill="#333">• Handles large model parameters (e.g., LLMs, large CNNs)</text>
      <text x="25" y="50" font-size="11" fill="#333">• Automatic chunking for models exceeding 300MB</text>
      <text x="25" y="65" font-size="11" fill="#333">• Efficient streaming via gRPC for memory-constrained environments</text>
    </g>
    
    <!-- Innovation 3 -->
    <g transform="translate(70, 660)">
      <circle cx="10" cy="10" r="8" fill="#00C853"/>
      <text x="25" y="15" font-size="13" font-weight="bold" fill="#1a2332">Parallel Heartbeat Mechanism</text>
      <text x="25" y="35" font-size="11" fill="#333">• Dual gRPC stub architecture: one for training, one for heartbeats</text>
      <text x="25" y="50" font-size="11" fill="#333">• Prevents server timeout during long client training sessions</text>
      <text x="25" y="65" font-size="11" fill="#333">• Maintains connection stability in heterogeneous client environments</text>
    </g>
    
    <!-- Innovation 4 -->
    <g transform="translate(70, 740)">
      <circle cx="10" cy="10" r="8" fill="#2196F3"/>
      <text x="25" y="15" font-size="13" font-weight="bold" fill="#1a2332">Full-Stack Integration</text>
      <text x="25" y="35" font-size="11" fill="#333">• React dashboard with real-time WebSocket log streaming</text>
      <text x="25" y="50" font-size="11" fill="#333">• Spring Boot orchestrates Python FL servers via ProcessBuilder</text>
      <text x="25" y="65" font-size="11" fill="#333">• Docker-based client deployment for zero-installation setup</text>
    </g>
    
    <!-- Innovation 5 -->
    <g transform="translate(70, 820)">
      <circle cx="10" cy="10" r="8" fill="#9C27B0"/>
      <text x="25" y="15" font-size="13" font-weight="bold" fill="#1a2332">Open Source & Production Ready</text>
      <text x="25" y="35" font-size="11" fill="#333">• Apache 2.0 licensed framework, backend, and frontend</text>
      <text x="25" y="50" font-size="11" fill="#333">• Deployed on AWS EC2 with PostgreSQL for scalable production use</text>
    </g>
  </g>

  <!-- Tech Stack Summary -->
  <g id="tech-summary">
    <rect x="980" y="450" width="370" height="420" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="1165" y="480" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a2332">Technology Stack</text>
    
    <g transform="translate(1000, 500)">
      <text x="0" y="0" font-size="12" font-weight="bold" fill="#1976D2">Frontend</text>
      <text x="0" y="20" font-size="10" fill="#333">• React 19 + Vite 6</text>
      <text x="0" y="35" font-size="10" fill="#333">• React Router v7</text>
      <text x="0" y="50" font-size="10" fill="#333">• Axios + STOMP.js</text>
      <text x="0" y="65" font-size="10" fill="#333">• Deployed on Vercel</text>
    </g>
    
    <g transform="translate(1000, 580)">
      <text x="0" y="0" font-size="12" font-weight="bold" fill="#1976D2">Backend</text>
      <text x="0" y="20" font-size="10" fill="#333">• Spring Boot 3 (Java 17)</text>
      <text x="0" y="35" font-size="10" fill="#333">• Spring Security + JWT</text>
      <text x="0" y="50" font-size="10" fill="#333">• WebSocket (STOMP)</text>
      <text x="0" y="65" font-size="10" fill="#333">• PostgreSQL + Hibernate</text>
      <text x="0" y="80" font-size="10" fill="#333">• Deployed on AWS EC2</text>
    </g>
    
    <g transform="translate(1000, 680)">
      <text x="0" y="0" font-size="12" font-weight="bold" fill="#1976D2">FL Framework</text>
      <text x="0" y="20" font-size="10" fill="#333">• Python 3.10+</text>
      <text x="0" y="35" font-size="10" fill="#333">• PyTorch 2.0+</text>
      <text x="0" y="50" font-size="10" fill="#333">• gRPC + Protobuf</text>
      <text x="0" y="65" font-size="10" fill="#333">• Custom from scratch</text>
    </g>
    
    <g transform="translate(1000, 770)">
      <text x="0" y="0" font-size="12" font-weight="bold" fill="#1976D2">DevOps</text>
      <text x="0" y="20" font-size="10" fill="#333">• Docker + Docker Compose</text>
      <text x="0" y="35" font-size="10" fill="#333">• AWS EC2 (Ubuntu)</text>
      <text x="0" y="50" font-size="10" fill="#333">• GitHub Actions CI/CD</text>
      <text x="0" y="65" font-size="10" fill="#333">• Vercel (Frontend)</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="700" y="895" font-size="11" text-anchor="middle" fill="#666">
    Open Source • Apache 2.0 License • Built by Learning Optimization Group, RIT
  </text>
</svg>
