# =============================================================================
# FedLearn — nginx TLS server block (EC2 demo)
# =============================================================================
# Canonical HTTPS front for the EC2 deployment:
#   browser → nginx :443 (TLS, Let's Encrypt) → Spring Boot on 127.0.0.1:8081
#
# This file is a TEMPLATE: every __FEDLEARN_DOMAIN__ token is substituted by
# scripts/ec2-bootstrap.sh (from $FEDLEARN_DOMAIN, default fedlearn.duckdns.org)
# and the result installed to /etc/nginx/sites-available/fedlearn.conf.
# scripts/deploy-to-aws.sh ships this file to the instance as
# ~/fedlearn-nginx.conf before bootstrap runs.
#
# IMPORTANT — install order: this block references the Let's Encrypt cert
# paths, which do not exist until certbot has issued the certificate, so
# `nginx -t` fails if it is installed first. Bootstrap therefore starts nginx
# with a minimal HTTP-only config (ACME webroot + proxy), obtains the cert via
# `certbot certonly --webroot`, and only then installs this block.
#
# FL gRPC traffic (ports 50000-50010) does NOT pass through nginx — see
# deploy/TLS.md for the FL-boundary TLS story.

# WebSocket upgrade mapping. This file is included inside nginx's http{}
# context (via sites-enabled), so a top-level map here is valid.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP :80 — ACME challenges + redirect everything else to HTTPS ───────────
server {
    listen 80;
    listen [::]:80;
    server_name __FEDLEARN_DOMAIN__;

    # Certbot webroot challenges. Must stay reachable over plain HTTP — both
    # first issuance and every renewal use this path.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — TLS termination, proxy to Spring Boot ───────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __FEDLEARN_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__FEDLEARN_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FEDLEARN_DOMAIN__/privkey.pem;

    # TLS 1.2+ only, Mozilla "intermediate" cipher set.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:fedlearn_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — browsers pin HTTPS for a year after the first visit.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The app accepts model-artifact uploads up to 2GB
    # (spring.servlet.multipart.max-request-size). Per-route caps — e.g. the
    # 16MB inference body limit — are enforced by the app itself, so nginx
    # only needs to not undercut the largest legitimate request.
    client_max_body_size 2g;

    # REST API (+ anything else the backend serves).
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # STOMP-over-WebSocket live training logs (/topic/logs/{projectId}).
    location /ws-logs {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Training-log streams are long-lived; don't cut the socket between
        # rounds of a slow federation.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
