<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; }
      #wrap { display: flex; align-items: center; justify-content: center; }
      img { display: block; }
    </style>
  </head>
  <body>
    <div id="wrap"><img id="i" /></div>
    <script>
      const p = new URLSearchParams(location.search);
      const file = p.get('f') || 'icon.svg';
      const size = parseInt(p.get('s') || '512', 10);
      const img = document.getElementById('i');
      img.width = size;
      img.height = size;
      img.src = file + '?v=' + Date.now();
      for (const el of [document.documentElement, document.body, document.getElementById('wrap')]) {
        el.style.width = size + 'px';
        el.style.height = size + 'px';
      }
    </script>
  </body>
</html>
