<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      .card {
        width: 1200px; height: 630px; position: relative;
        background:
          radial-gradient(50% 60% at 22% 38%, rgba(247,163,92,0.16), transparent 70%),
          radial-gradient(60% 70% at 85% 10%, rgba(247,163,92,0.07), transparent 70%),
          #000000;
        display: flex; align-items: center; gap: 64px; padding: 0 96px;
        font-family: 'Hanken Grotesk', sans-serif;
      }
      .dots {
        position: absolute; inset: 0;
        background-image: radial-gradient(circle, #1E1B17 1.4px, transparent 1.4px);
        background-size: 34px 34px;
        -webkit-mask-image: radial-gradient(70% 80% at 30% 50%, #000 10%, transparent 75%);
      }
      .mark { width: 300px; height: 300px; flex: none; position: relative; z-index: 1; }
      .copy { position: relative; z-index: 1; }
      .eyebrow {
        font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: 0.22em;
        text-transform: uppercase; color: #F7A35C; margin-bottom: 22px;
      }
      .word { font-family: 'Bricolage Grotesque', sans-serif; font-variation-settings: 'opsz' 96, 'wght' 640; font-size: 104px; line-height: 0.96; color: #F5F1EA; letter-spacing: -0.035em; }
      .word b { color: #F7A35C; }
      .tag { margin-top: 22px; font-size: 34px; line-height: 1.3; color: #A8A096; font-weight: 400; max-width: 620px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dots"></div>
      <img class="mark" src="mark.svg" />
      <div class="copy">
        <div class="eyebrow">Privacy-first federated learning</div>
        <div class="word">Fed<b>Learn</b></div>
        <div class="tag">Train AI together. Share nothing. Many devices, one smart model — your data never leaves home.</div>
      </div>
    </div>
    <script>
      window.__ready = false;
      (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
        setTimeout(() => { window.__ready = true; }, 150);
      });
    </script>
  </body>
</html>
