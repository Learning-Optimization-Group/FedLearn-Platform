<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FedLearn ember-node mark">
  <defs>
    <radialGradient id="ember" cx="42%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#FFE2C2"/>
      <stop offset="42%" stop-color="#F7A35C"/>
      <stop offset="100%" stop-color="#DB7430"/>
    </radialGradient>
    <radialGradient id="emberFar" cx="42%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#FFC893"/>
      <stop offset="60%" stop-color="#F1924A"/>
      <stop offset="100%" stop-color="#C9651F"/>
    </radialGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFAE6B" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#F7913F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F7913F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#2A1606"/>
      <stop offset="55%" stop-color="#0A0603"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="spoke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7A35C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F7A35C" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- AMOLED squircle backdrop with a warm glow rising from the cluster -->
  <rect width="1024" height="1024" rx="232" fill="#000000"/>
  <rect width="1024" height="1024" rx="232" fill="url(#bgGlow)"/>

  <!-- spokes: device updates flowing inward to the shared model -->
  <g stroke="url(#spoke)" stroke-width="9" stroke-linecap="round">
    <line x1="512" y1="512" x2="512" y2="212"/>
    <line x1="512" y1="512" x2="772" y2="362"/>
    <line x1="512" y1="512" x2="772" y2="662"/>
    <line x1="512" y1="512" x2="512" y2="812"/>
    <line x1="512" y1="512" x2="252" y2="662"/>
    <line x1="512" y1="512" x2="252" y2="362"/>
  </g>

  <!-- satellite device nodes (alternating near/far weight for rhythm) -->
  <g>
    <circle cx="512" cy="212" r="48" fill="url(#ember)"/>
    <circle cx="772" cy="362" r="34" fill="url(#emberFar)"/>
    <circle cx="772" cy="662" r="44" fill="url(#ember)"/>
    <circle cx="512" cy="812" r="34" fill="url(#emberFar)"/>
    <circle cx="252" cy="662" r="44" fill="url(#ember)"/>
    <circle cx="252" cy="362" r="34" fill="url(#emberFar)"/>
  </g>

  <!-- central ember: the shared model, glowing -->
  <circle cx="512" cy="512" r="200" fill="url(#bloom)" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="118" fill="url(#ember)"/>
  <circle cx="476" cy="476" r="40" fill="#FFF1E2" fill-opacity="0.7" filter="url(#soft)"/>
</svg>
