<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      :root {
        --bg:#000; --card:#0B0A09; --card2:#141210; --hair:rgba(255,244,232,0.10); --line:rgba(255,244,232,0.16);
        --fg:#F5F1EA; --muted:#A8A096; --subtle:#6E665C;
        --ember:#F7A35C; --rest:#F7A35C; --ws:#5FD39B; --grpc:#6FA8FF; --spawn:#9C9488;
      }
      * { margin:0; padding:0; box-sizing:border-box; }
      body { width:1600px; height:1180px; background:var(--bg); font-family:'Hanken Grotesk',sans-serif; -webkit-font-smoothing:antialiased; }
      .stage { position:relative; width:1600px; height:1180px; overflow:hidden; }
      .glow { position:absolute; inset:0; background:radial-gradient(55% 38% at 50% 2%, rgba(247,163,92,0.09), transparent 70%); }
      .grid { position:absolute; inset:0; background-image:radial-gradient(circle, #1A1714 1px, transparent 1px); background-size:30px 30px; -webkit-mask-image:radial-gradient(80% 75% at 50% 45%, #000 35%, transparent 100%); }

      header { position:absolute; left:56px; top:38px; z-index:3; display:flex; align-items:center; gap:14px; }
      header h1 { font-family:'Bricolage Grotesque'; font-variation-settings:'opsz' 40,'wght' 600; font-size:30px; color:var(--fg); letter-spacing:-0.02em; line-height:1; }
      header p { color:var(--muted); font-size:14px; margin-top:5px; }

      .lane-hd { position:absolute; z-index:3; width:188px; transform:translateX(-94px); display:flex; flex-direction:column; align-items:center; gap:8px;
                 background:var(--card); border:1px solid var(--hair); border-radius:14px; padding:13px 10px; box-shadow:0 16px 40px -22px rgba(0,0,0,0.9); }
      .lane-hd .tile { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; color:var(--ember);
                       background:radial-gradient(120% 120% at 30% 0%, rgba(247,163,92,0.16), transparent 70%), var(--card2); border:1px solid var(--hair); }
      .lane-hd .tile svg { width:19px; height:19px; }
      .lane-hd .n { font-size:14.5px; font-weight:600; color:var(--fg); }
      .lane-hd .s { font-family:'JetBrains Mono'; font-size:11px; color:var(--subtle); }

      .wires { position:absolute; inset:0; z-index:1; }
      .lbl { font-size:13px; fill:var(--fg); }
      .lbl.m { font-family:'JetBrains Mono'; font-size:12px; fill:var(--muted); }
      .cap { font-size:11px; fill:var(--subtle); }
      .phase { font-family:'JetBrains Mono'; font-size:11px; letter-spacing:0.14em; fill:var(--subtle); }
      .num { fill:var(--ember); }
      .numt { fill:#1C0F03; font-size:12px; font-weight:700; font-family:'Hanken Grotesk'; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="glow"></div>
      <div class="grid"></div>

      <header>
        <svg width="42" height="42" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs><radialGradient id="e1" cx="42%" cy="34%" r="72%"><stop offset="0%" stop-color="#FFE2C2"/><stop offset="42%" stop-color="#F7A35C"/><stop offset="100%" stop-color="#DB7430"/></radialGradient>
          <linearGradient id="sp1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F7A35C" stop-opacity="0.85"/><stop offset="100%" stop-color="#F7A35C" stop-opacity="0.22"/></linearGradient></defs>
          <g stroke="url(#sp1)" stroke-width="10" stroke-linecap="round"><line x1="512" y1="512" x2="512" y2="212"/><line x1="512" y1="512" x2="772" y2="362"/><line x1="512" y1="512" x2="772" y2="662"/><line x1="512" y1="512" x2="512" y2="812"/><line x1="512" y1="512" x2="252" y2="662"/><line x1="512" y1="512" x2="252" y2="362"/></g>
          <g fill="url(#e1)"><circle cx="512" cy="212" r="48"/><circle cx="772" cy="362" r="34"/><circle cx="772" cy="662" r="44"/><circle cx="512" cy="812" r="34"/><circle cx="252" cy="662" r="44"/><circle cx="252" cy="362" r="34"/></g>
          <circle cx="512" cy="512" r="118" fill="url(#e1)"/>
        </svg>
        <div><h1>FedLearn — How a training run flows</h1><p>From "create a project" to a trained model — step by step.</p></div>
      </header>

      <!-- lane headers -->
      <div class="lane-hd" style="left:200px; top:110px;"><span class="tile"><i data-lucide="user-round"></i></span><span class="n">You</span></div>
      <div class="lane-hd" style="left:510px; top:110px;"><span class="tile"><i data-lucide="layout-dashboard"></i></span><span class="n">Dashboard</span><span class="s">browser</span></div>
      <div class="lane-hd" style="left:820px; top:110px;"><span class="tile"><i data-lucide="server"></i></span><span class="n">Backend</span><span class="s">Spring :8081</span></div>
      <div class="lane-hd" style="left:1130px; top:110px;"><span class="tile"><i data-lucide="share-2"></i></span><span class="n">FL Server</span><span class="s">:50000</span></div>
      <div class="lane-hd" style="left:1440px; top:110px;"><span class="tile"><i data-lucide="smartphone"></i></span><span class="n">Devices</span><span class="s">phone · laptop</span></div>

      <svg class="wires" viewBox="0 0 1600 1180" fill="none">
        <defs>
          <marker id="mR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="var(--rest)"/></marker>
          <marker id="mW" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="var(--ws)"/></marker>
          <marker id="mG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="var(--grpc)"/></marker>
          <marker id="mS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="var(--spawn)"/></marker>
        </defs>

        <!-- lifelines -->
        <g stroke="var(--hair)" stroke-width="1.5" stroke-dasharray="2 7">
          <line x1="200" y1="186" x2="200" y2="1110"/><line x1="510" y1="186" x2="510" y2="1110"/>
          <line x1="820" y1="186" x2="820" y2="1110"/><line x1="1130" y1="186" x2="1130" y2="1110"/>
          <line x1="1440" y1="186" x2="1440" y2="1110"/>
        </g>

        <!-- phase guides (far left) -->
        <text class="phase" x="40" y="270">SET UP</text>
        <text class="phase" x="40" y="440">CONNECT</text>
        <text class="phase" x="40" y="616">TRAIN</text>
        <text class="phase" x="40" y="806">STREAM</text>
        <text class="phase" x="40" y="948">FINISH</text>

        <!-- ============ SET UP ============ -->
        <!-- 1 You -> Dashboard -->
        <line x1="200" y1="248" x2="510" y2="248" stroke="var(--rest)" stroke-width="2.5" marker-end="url(#mR)"/>
        <text class="lbl" x="355" y="238" text-anchor="middle">Open &amp; sign in</text>
        <!-- 2 Dashboard -> Backend -->
        <line x1="510" y1="310" x2="820" y2="310" stroke="var(--rest)" stroke-width="2.5" marker-end="url(#mR)"/>
        <text class="lbl m" x="665" y="300" text-anchor="middle">POST /projects/{id}/start</text>
        <!-- 3 Backend -> FL Server (spawn) -->
        <line x1="820" y1="372" x2="1130" y2="372" stroke="var(--spawn)" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#mS)"/>
        <text class="lbl" x="975" y="362" text-anchor="middle" fill="var(--muted)">spawn <tspan class="lbl m" fill="var(--muted)">fl_server.py</tspan> · reserve port</text>

        <!-- ============ CONNECT ============ -->
        <!-- 4 Devices -> Backend -->
        <line x1="1440" y1="452" x2="820" y2="452" stroke="var(--rest)" stroke-width="2.5" marker-end="url(#mR)"/>
        <text class="lbl m" x="1130" y="442" text-anchor="middle">GET /client/projects/{id}/connection</text>
        <!-- 5 Devices -> FL Server -->
        <line x1="1440" y1="514" x2="1130" y2="514" stroke="var(--grpc)" stroke-width="2.5" marker-end="url(#mG)"/>
        <text class="lbl" x="1285" y="504" text-anchor="middle">connect · <tspan class="lbl m">RegisterClient</tspan></text>

        <!-- ============ TRAIN (loop) ============ -->
        <rect x="1062" y="556" width="476" height="232" rx="16" fill="rgba(111,168,255,0.05)" stroke="var(--grpc)" stroke-opacity="0.45" stroke-dasharray="7 6"/>
        <text class="lbl" x="1078" y="582" fill="var(--grpc)" font-weight="600">↻ each training round — repeats N times</text>

        <!-- heartbeat (parallel) faint vertical -->
        <line x1="1500" y1="600" x2="1500" y2="772" stroke="var(--ws)" stroke-width="1.5" stroke-dasharray="3 5" marker-start="url(#mW)" marker-end="url(#mW)" opacity="0.6"/>
        <text class="cap" x="1492" y="690" text-anchor="end" fill="var(--ws)" opacity="0.85">heartbeat</text>
        <text class="cap" x="1492" y="704" text-anchor="end" fill="var(--ws)" opacity="0.85">(parallel)</text>

        <!-- 6 FL -> Devices : global model -->
        <line x1="1130" y1="626" x2="1440" y2="626" stroke="var(--grpc)" stroke-width="2.5" marker-end="url(#mG)"/>
        <text class="lbl" x="1285" y="616" text-anchor="middle">global model <tspan class="cap">(auto-chunked)</tspan></text>
        <!-- 7 Devices -> FL : train + update -->
        <line x1="1440" y1="690" x2="1130" y2="690" stroke="var(--grpc)" stroke-width="2.5" marker-end="url(#mG)"/>
        <text class="lbl" x="1285" y="680" text-anchor="middle">train on local data → send update</text>
        <!-- 8 FL self : aggregate -->
        <path d="M1130,726 q-58,0 -58,20 q0,20 58,20" stroke="var(--grpc)" stroke-width="2.5" fill="none" marker-end="url(#mG)"/>
        <text class="lbl" x="1058" y="751" text-anchor="end">aggregate · <tspan fill="var(--ember)">FedAvg / DeComFL / FoT</tspan></text>

        <!-- ============ STREAM ============ -->
        <!-- 9 FL -> Backend : results -->
        <line x1="1130" y1="840" x2="820" y2="840" stroke="var(--rest)" stroke-width="2.5" marker-end="url(#mR)"/>
        <text class="lbl m" x="975" y="830" text-anchor="middle">POST /internal/results</text>
        <text class="cap" x="975" y="858" text-anchor="middle">after each round →</text>
        <!-- 10 Backend -> Dashboard : STOMP -->
        <line x1="820" y1="902" x2="510" y2="902" stroke="var(--ws)" stroke-width="2.5" marker-end="url(#mW)"/>
        <text class="lbl m" x="665" y="892" text-anchor="middle" fill="var(--ws)">STOMP /topic/results · logs · status</text>
        <text class="cap" x="665" y="920" text-anchor="middle">live charts &amp; logs update</text>

        <!-- ============ FINISH ============ -->
        <!-- 11 FL -> Backend : finished -->
        <line x1="1130" y1="984" x2="820" y2="984" stroke="var(--rest)" stroke-width="2.5" marker-end="url(#mR)"/>
        <text class="lbl" x="975" y="974" text-anchor="middle">training complete → <tspan class="lbl m">/finished</tspan></text>
        <!-- 12 Backend -> Dashboard : done -->
        <line x1="820" y1="1046" x2="510" y2="1046" stroke="var(--ws)" stroke-width="2.5" marker-end="url(#mW)"/>
        <text class="lbl" x="665" y="1036" text-anchor="middle" fill="var(--ws)">status = Done ✓</text>

        <!-- step number badges -->
        <g class="badges" font-family="Hanken Grotesk">
          <g><circle class="num" cx="200" cy="248" r="11"/><text class="numt" x="200" y="252" text-anchor="middle">1</text></g>
          <g><circle class="num" cx="510" cy="310" r="11"/><text class="numt" x="510" y="314" text-anchor="middle">2</text></g>
          <g><circle class="num" cx="820" cy="372" r="11"/><text class="numt" x="820" y="376" text-anchor="middle">3</text></g>
          <g><circle class="num" cx="1440" cy="452" r="11"/><text class="numt" x="1440" y="456" text-anchor="middle">4</text></g>
          <g><circle class="num" cx="1440" cy="514" r="11"/><text class="numt" x="1440" y="518" text-anchor="middle">5</text></g>
          <g><circle class="num" cx="1130" cy="626" r="11"/><text class="numt" x="1130" y="630" text-anchor="middle">6</text></g>
          <g><circle class="num" cx="1440" cy="690" r="11"/><text class="numt" x="1440" y="694" text-anchor="middle">7</text></g>
          <g><circle class="num" cx="1130" cy="746" r="11"/><text class="numt" x="1130" y="750" text-anchor="middle">8</text></g>
          <g><circle class="num" cx="1130" cy="840" r="11"/><text class="numt" x="1130" y="844" text-anchor="middle">9</text></g>
          <g><circle class="num" cx="820" cy="902" r="11"/><text class="numt" x="820" y="906" text-anchor="middle" font-size="11">10</text></g>
          <g><circle class="num" cx="1130" cy="984" r="11"/><text class="numt" x="1130" y="988" text-anchor="middle" font-size="11">11</text></g>
          <g><circle class="num" cx="820" cy="1046" r="11"/><text class="numt" x="820" y="1050" text-anchor="middle" font-size="11">12</text></g>
        </g>
      </svg>
    </div>
    <script>
      window.__ready = false;
      lucide.createIcons();
      (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { window.__ready = true; }, 200));
    </script>
  </body>
</html>
